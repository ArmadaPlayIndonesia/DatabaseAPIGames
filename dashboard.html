<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Admin — Klik" Penghasil Saldo Dana</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟡</text></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .app-container {
      width: 100%;
      max-width: 480px;
      background: #0f172a;
      padding: 16px 12px 80px;
      position: relative;
      min-height: 100vh;
    }

    /* Header */
    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-left h1 {
      font-size: 1.1rem;
      font-weight: 700;
      background: linear-gradient(135deg, #f59e0b, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      white-space: nowrap;
    }
    .header-left .subtitle {
      font-size: 0.65rem;
      color: #94a3b8;
      white-space: nowrap;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid #475569;
      color: #e2e8f0;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.7rem;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-outline:hover {
      background: #1e293b;
      border-color: #f59e0b;
      color: #f59e0b;
    }
    .lang-toggle {
      display: flex;
      border: 1px solid #475569;
      border-radius: 8px;
      overflow: hidden;
      font-size: 0.65rem;
      font-weight: 600;
    }
    .lang-toggle button {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 5px 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .lang-toggle button.active {
      background: #f59e0b;
      color: #0f172a;
    }

    /* Tab Navigasi */
    .tab-nav {
      display: flex;
      gap: 0;
      margin-bottom: 16px;
      border-bottom: 1px solid #334155;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .tab-nav::-webkit-scrollbar {
      display: none;
    }
    .tab-nav button {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 10px 14px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .tab-nav button.active {
      color: #f59e0b;
      border-bottom-color: #f59e0b;
    }
    .tab-nav button:hover {
      color: #e2e8f0;
    }

    /* Cards */
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .card-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 14px 12px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-card .label {
      font-size: 0.65rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat-card .value {
      font-size: 1.25rem;
      font-weight: 700;
      color: #f59e0b;
      word-break: break-word;
    }
    .stat-card .value.green {
      color: #22c55e;
    }
    .stat-card .value.red {
      color: #ef4444;
    }

    /* Tombol utama */
    .btn-primary {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: none;
      color: #0f172a;
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
      width: 100%;
    }
    .btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .btn-sm {
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 0.65rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }
    .btn-sm:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-success {
      background: #22c55e;
      color: #0f172a;
    }
    .btn-success:hover {
      background: #16a34a;
    }
    .btn-danger {
      background: #ef4444;
      color: #fff;
    }
    .btn-danger:hover {
      background: #dc2626;
    }
    .btn-ghost {
      background: transparent;
      border: 1px solid #475569;
      color: #e2e8f0;
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 0.65rem;
      cursor: pointer;
    }
    .btn-ghost:hover {
      border-color: #f59e0b;
      color: #f59e0b;
    }

    /* Tabel */
    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 10px;
      border: 1px solid #334155;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.7rem;
      min-width: 600px;
    }
    th {
      background: #0f172a;
      color: #f59e0b;
      font-weight: 600;
      text-align: left;
      padding: 8px 6px;
      white-space: nowrap;
      border-bottom: 1px solid #334155;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    td {
      padding: 8px 6px;
      border-bottom: 1px solid #1e293b;
      color: #cbd5e1;
      vertical-align: middle;
    }
    tr:last-child td {
      border-bottom: none;
    }
    tr:hover td {
      background: #1a2437;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 0.6rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-pending {
      background: #78350f;
      color: #fbbf24;
    }
    .badge-approved {
      background: #14532d;
      color: #4ade80;
    }
    .badge-rejected {
      background: #7f1d1d;
      color: #fca5a5;
    }
    .badge-admin {
      background: #f59e0b;
      color: #0f172a;
    }
    .badge-user {
      background: #334155;
      color: #cbd5e1;
    }
    .empty-state {
      text-align: center;
      padding: 30px 10px;
      color: #94a3b8;
      font-size: 0.8rem;
    }
    .action-cell {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    /* Form */
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 0.7rem;
      color: #94a3b8;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 9px 10px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #e2e8f0;
      font-size: 0.75rem;
      outline: none;
      transition: 0.2s;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #f59e0b;
    }
    .form-group textarea {
      resize: vertical;
      min-height: 60px;
    }
    .search-input {
      width: 100%;
      padding: 9px 12px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #e2e8f0;
      font-size: 0.75rem;
      outline: none;
      margin-bottom: 12px;
      transition: 0.2s;
    }
    .search-input:focus {
      border-color: #f59e0b;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #fff;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      max-width: 90vw;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-10px);
    }
    .toast.success {
      background: #22c55e;
      color: #0f172a;
    }
    .toast.error {
      background: #ef4444;
      color: #fff;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-box {
      background: #1e293b;
      border-radius: 14px;
      padding: 20px;
      max-width: 420px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      border: 1px solid #334155;
    }
    .modal-box h3 {
      font-size: 1rem;
      color: #f59e0b;
      margin-bottom: 14px;
    }
    .modal-detail {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #0f172a;
      font-size: 0.72rem;
      gap: 10px;
    }
    .modal-detail .k {
      color: #94a3b8;
      flex-shrink: 0;
    }
    .modal-detail .v {
      color: #e2e8f0;
      text-align: right;
      word-break: break-word;
    }
    .modal-close {
      margin-top: 16px;
    }

    /* Utility */
    .hidden {
      display: none !important;
    }
    .flex-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .mb-12 {
      margin-bottom: 12px;
    }
    .text-muted {
      color: #94a3b8;
      font-size: 0.65rem;
    }
    .loading-spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #0f172a;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 4px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="app-container" id="app">
    <!-- Header -->
    <header class="admin-header" id="adminHeader">
      <div class="header-left">
        <div>
          <h1>⚙️ <span data-i18n="adminPanel">Admin Panel</span></h1>
          <div class="subtitle">"Klik" Penghasil Saldo Dana</div>
        </div>
      </div>
      <div class="header-right">
        <a href="index.html#dashboard" class="btn-outline" data-i18n="toDashboard">Ke Dashboard User</a>
        <button class="btn-outline" id="logoutBtn" data-i18n="logout">Logout</button>
        <div class="lang-toggle" id="langToggle">
          <button id="langId" class="active">ID</button>
          <button id="langEn">EN</button>
        </div>
      </div>
    </header>

    <!-- Tab Navigasi -->
    <nav class="tab-nav" id="tabNav">
      <button data-page="stats" class="active" data-i18n="tabStats">Statistik</button>
      <button data-page="payouts" data-i18n="tabPayouts">Payouts</button>
      <button data-page="users" data-i18n="tabUsers">Users</button>
      <button data-page="settings" data-i18n="tabSettings">Settings</button>
    </nav>

    <!-- ========== PAGE: STATS ========== -->
    <section id="page-stats">
      <div class="flex-row" style="justify-content: flex-end; margin-bottom: 12px;">
        <button class="btn-ghost" id="refreshStatsBtn" data-i18n="refresh">🔄 Refresh</button>
      </div>
      <div class="card-grid" id="statsGrid">
        <div class="stat-card">
          <span class="label" data-i18n="totalUser">Total User</span>
          <span class="value" id="statTotalUser">—</span>
        </div>
        <div class="stat-card">
          <span class="label" data-i18n="coinCirculation">Koin Beredar</span>
          <span class="value" id="statCoinCirculation">—</span>
        </div>
        <div class="stat-card">
          <span class="label" data-i18n="payoutPending">Payout Pending</span>
          <span class="value red" id="statPayoutPending">—</span>
        </div>
        <div class="stat-card">
          <span class="label" data-i18n="payoutApproved">Payout Approved</span>
          <span class="value green" id="statPayoutApproved">—</span>
        </div>
        <div class="stat-card">
          <span class="label" data-i18n="totalPaid">Total Dibayar</span>
          <span class="value green" id="statTotalPaid">—</span>
        </div>
        <div class="stat-card">
          <span class="label" data-i18n="adsToday">Total Iklan Hari Ini</span>
          <span class="value" id="statAdsToday">—</span>
        </div>
      </div>
    </section>

    <!-- ========== PAGE: PAYOUTS ========== -->
    <section id="page-payouts" class="hidden">
      <div class="flex-row mb-12">
        <select id="payoutFilter" class="search-input" style="margin-bottom:0; flex:1; min-width:120px;">
          <option value="all" data-i18n="filterAll">Semua</option>
          <option value="pending" selected data-i18n="filterPending">Pending</option>
          <option value="approved" data-i18n="filterApproved">Approved</option>
          <option value="rejected" data-i18n="filterRejected">Rejected</option>
        </select>
        <button class="btn-ghost" id="refreshPayoutsBtn" data-i18n="refresh">🔄 Refresh</button>
      </div>
      <div id="payoutsTableWrap"></div>
    </section>

    <!-- ========== PAGE: USERS ========== -->
    <section id="page-users" class="hidden">
      <input type="text" id="userSearch" class="search-input" placeholder="Cari email..." data-i18n-placeholder="searchEmail">
      <div id="usersTableWrap"></div>
    </section>

    <!-- ========== PAGE: SETTINGS ========== -->
    <section id="page-settings" class="hidden">
      <form id="settingsForm" autocomplete="off">
        <div class="card">
          <div class="form-group">
            <label data-i18n="monetagLinks">Monetag Links (pisah koma)</label>
            <textarea id="set_monetag_links" placeholder="https://link1.com,https://link2.com"></textarea>
          </div>
          <div class="form-group">
            <label data-i18n="adsterraLink">Adsterra Link</label>
            <input type="text" id="set_adsterra_link" placeholder="https://...">
          </div>
          <div class="form-group">
            <label data-i18n="rewardPerAd">Reward per Iklan</label>
            <input type="number" id="set_reward_per_ad" step="0.01" min="0">
          </div>
          <div class="form-group">
            <label data-i18n="dailyLimit">Batas Harian</label>
            <input type="number" id="set_daily_limit" step="1" min="0">
          </div>
          <div class="form-group">
            <label data-i18n="conversionFee">Potongan Konversi %</label>
            <input type="number" id="set_conversion_fee_percent" step="0.1" min="0" max="100">
          </div>
          <div class="form-group">
            <label data-i18n="checkinMin">Check-in Min</label>
            <input type="number" id="set_checkin_min" step="1" min="0">
          </div>
          <div class="form-group">
            <label data-i18n="checkinMax">Check-in Max</label>
            <input type="number" id="set_checkin_max" step="1" min="0">
          </div>
          <div class="form-group">
            <label data-i18n="coinRate">Coin Rate</label>
            <input type="number" id="set_coin_rate" step="1" min="1" value="10000">
          </div>
          <div class="form-group">
            <label data-i18n="coinExpiryDays">Coin Expiry Days</label>
            <input type="number" id="set_coin_expiry_days" step="1" min="1" value="30">
          </div>
        </div>
        <button type="submit" class="btn-primary" id="saveSettingsBtn" data-i18n="saveSettings">SIMPAN PENGATURAN</button>
        <p class="text-muted" style="margin-top:10px; text-align:center;" id="settingsUpdatedAt"></p>
      </form>
    </section>
  </div>

  <!-- Modal Container -->
  <div id="modalContainer"></div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

        tableUser: "User (email)",
        tableCoin: "Coin",
        tableRupiah: "Rupiah",
        tableMethod: "Method",
        tableAccount: "Account Number",
        tableStatus: "Status",
        tableAction: "Action",
        tableEmail: "Email",
        tableRole: "Role",
        tableBalance: "Balance",
        tablePending: "Pending",
        tableLastLogin: "Last Login",
        modalEmail: "Email",
        modalRole: "Role",
        modalBalance: "Balance",
        modalPending: "Pending",
        modalDevice: "Device Fingerprint",
        modalPhone: "Phone",
        modalLastLogin: "Last Login",
        modalCoinExpiry: "Coin Expiry",
        modalCreated: "Created",
        close: "Close",
        loading: "Loading...",
        needAdmin: "Access denied. Admins only.",
        notLoggedIn: "Please login first."
      }
    };

    function t(key) {
      return (T[currentLang] && T[currentLang][key]) || T.id[key] || key;
    }

    // ==================== UTILITAS ====================
    function showToast(msg, type = "success") {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.className = "toast show " + type;
      clearTimeout(el._timer);
      el._timer = setTimeout(() => {
        el.className = "toast " + type;
      }, 3000);
    }

    function formatDate(iso) {
      if (!iso) return "—";
      try {
        const d = new Date(iso);
        return d.toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "numeric" }) +
          " " + d.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
      } catch { return iso; }
    }

    function formatRupiah(n) {
      if (n == null) return "Rp 0";
      return "Rp " + Number(n).toLocaleString("id-ID");
    }

    function formatNumber(n) {
      if (n == null) return "0";
      return Number(n).toLocaleString("id-ID");
    }

    function escapeHtml(s) {
      if (s == null) return "";
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // Terapkan bahasa ke elemen dengan data-i18n
    function applyLanguage() {
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (T[currentLang] && T[currentLang][key]) {
          el.textContent = T[currentLang][key];
        }
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
        const key = el.getAttribute("data-i18n-placeholder");
        if (T[currentLang] && T[currentLang][key]) {
          el.placeholder = T[currentLang][key];
        }
      });
      document.getElementById("langId").classList.toggle("active", currentLang === "id");
      document.getElementById("langEn").classList.toggle("active", currentLang === "en");
      // Perbarui placeholder filter
      document.getElementById("payoutFilter").querySelectorAll("option").forEach(opt => {
        const key = opt.getAttribute("data-i18n");
        if (key && T[currentLang][key]) opt.textContent = T[currentLang][key];
      });
      // Perbarui tombol action yang sudah dirender
      document.querySelectorAll("[data-action-i18n]").forEach(el => {
        const key = el.getAttribute("data-action-i18n");
        if (T[currentLang][key]) el.textContent = T[currentLang][key];
      });
    }

    // ==================== AUTH & ROLE CHECK ====================
    async function checkAuthAndRole() {
      try {
        const { data: { session }, error: sessionErr } = await supabase.auth.getSession();
        if (sessionErr) throw sessionErr;
        if (!session) {
          window.location.href = "index.html#login";
          return false;
        }
        currentUser = session.user;

        const { data: userData, error: userErr } = await supabase
          .from("users")
          .select("*")
          .eq("id", currentUser.id)
          .maybeSingle();

        if (userErr) throw userErr;
        if (!userData || userData.role !== "admin") {
          showToast(t("needAdmin"), "error");
          setTimeout(() => { window.location.href = "index.html#dashboard"; }, 1500);
          return false;
        }
        currentUserData = userData;
        return true;
      } catch (err) {
        console.error("Auth error:", err);
        showToast(t("errorGeneral") + ": " + err.message, "error");
        return false;
      }
    }

    // ==================== ROUTING ====================
    const PAGES = ["stats", "payouts", "users", "settings"];

    function showPage(name) {
      if (!PAGES.includes(name)) name = "stats";
      PAGES.forEach(p => {
        const sec = document.getElementById("page-" + p);
        if (sec) sec.classList.toggle("hidden", p !== name);
      });
      document.querySelectorAll("#tabNav button").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.page === name);
      });
      if (window.location.hash !== "#" + name) {
        history.replaceState(null, "", "#" + name);
      }
      // Load data sesuai halaman
      if (name === "stats") loadStats();
      else if (name === "payouts") loadPayouts();
      else if (name === "users") loadUsers();
      else if (name === "settings") loadSettings();
    }

    function initRouting() {
      const hash = window.location.hash.replace("#", "");
      if (PAGES.includes(hash)) {
        showPage(hash);
      } else {
        showPage("stats");
      }
      document.querySelectorAll("#tabNav button").forEach(btn => {
        btn.addEventListener("click", () => showPage(btn.dataset.page));
      });
      window.addEventListener("hashchange", () => {
        const h = window.location.hash.replace("#", "");
        if (PAGES.includes(h)) showPage(h);
        else showPage("stats");
      });
    }

    // ==================== 1. STATS ====================
    async function loadStats() {
      const elTU = document.getElementById("statTotalUser");
      const elCC = document.getElementById("statCoinCirculation");
      const elPP = document.getElementById("statPayoutPending");
      const elPA = document.getElementById("statPayoutApproved");
      const elTP = document.getElementById("statTotalPaid");
      const elAT = document.getElementById("statAdsToday");
      elTU.textContent = "…"; elCC.textContent = "…"; elPP.textContent = "…";
      elPA.textContent = "…"; elTP.textContent = "…"; elAT.textContent = "…";

      try {
        // Total user aktif
        const { count: totalUsers, error: e1 } = await supabase
          .from("users").select("*", { count: "exact", head: true }).eq("status", "active");
        if (e1) throw e1;
        elTU.textContent = formatNumber(totalUsers || 0);

        // Koin beredar: sum coin_balance + coin_pending semua user
        const { data: coinData, error: e2 } = await supabase
          .from("users").select("coin_balance, coin_pending");
        if (e2) throw e2;
        const totalCoins = (coinData || []).reduce((s, u) => s + (Number(u.coin_balance) || 0) + (Number(u.coin_pending) || 0), 0);
        elCC.textContent = formatNumber(totalCoins);

        // Payout pending
        const { count: pendingCount, error: e3 } = await supabase
          .from("payouts").select("*", { count: "exact", head: true }).eq("status", "pending");
        if (e3) throw e3;
        elPP.textContent = formatNumber(pendingCount || 0);

        // Payout approved
        const { count: approvedCount, error: e4 } = await supabase
          .from("payouts").select("*", { count: "exact", head: true }).eq("status", "approved");
        if (e4) throw e4;
        elPA.textContent = formatNumber(approvedCount || 0);

        // Total dibayar (sum rupiah_amount where approved)
        const { data: paidData, error: e5 } = await supabase
          .from("payouts").select("rupiah_amount").eq("status", "approved");
        if (e5) throw e5;
        const totalPaid = (paidData || []).reduce((s, p) => s + (Number(p.rupiah_amount) || 0), 0);
        elTP.textContent = formatRupiah(totalPaid);

        // Total iklan hari ini (WIB = UTC+7)
        const now = new Date();
        const wibOffset = 7 * 60 * 60 * 1000;
        const wibNow = new Date(now.getTime() + wibOffset);
        const startWIB = new Date(Date.UTC(wibNow.getUTCFullYear(), wibNow.getUTCMonth(), wibNow.getUTCDate()));
        const startUTC = new Date(startWIB.getTime() - wibOffset);
        const endUTC = new Date(startUTC.getTime() + 24 * 60 * 60 * 1000);

        const { count: adsCount, error: e6 } = await supabase
          .from("ad_clicks")
          .select("*", { count: "exact", head: true })
          .gte("created_at", startUTC.toISOString())
          .lt("created_at", endUTC.toISOString());
        if (e6) throw e6;
        elAT.textContent = formatNumber(adsCount || 0);

      } catch (err) {
        console.error("Stats error:", err);
        showToast(t("errorGeneral") + ": " + err.message, "error");
      }
    }

    // ==================== 2. PAYOUTS ====================
    async function loadPayouts() {
      const wrap = document.getElementById("payoutsTableWrap");
      wrap.innerHTML = `<div class="empty-state">${t("loading")}</div>`;
      const filter = document.getElementById("payoutFilter").value;

      try {
        let query = supabase
          .from("payouts")
          .select("*, users!payouts_user_id_fkey(email)")
          .order("created_at", { ascending: false });

        if (filter !== "all") {
          query = query.eq("status", filter);
        }

        const { data, error } = await query;
        if (error) throw error;
        payoutsCache = data || [];

        if (payoutsCache.length === 0) {
          wrap.innerHTML = `<div class="empty-state">${t("noPayout")}</div>`;
          return;
        }

        let html = `<div class="table-wrap"><table><thead><tr>
          <th>${t("tableDate")}</th>
          <th>${t("tableUser")}</th>
          <th>${t("tableCoin")}</th>
          <th>${t("tableRupiah")}</th>
          <th>${t("tableMethod")}</th>
          <th>${t("tableAccount")}</th>
          <th>${t("tableStatus")}</th>
          <th>${t("tableAction")}</th>
        </tr></thead><tbody>`;

        payoutsCache.forEach(p => {
          const email = p.users?.email || p.email || "—";
          const statusClass = p.status === "pending" ? "badge-pending" : p.status === "approved" ? "badge-approved" : "badge-rejected";
          const actions = p.status === "pending"
            ? `<div class="action-cell">
                <button class="btn-sm btn-success" onclick="approvePayout('${p.id}')" data-action-i18n="approve">${t("approve")}</button>
                <button class="btn-sm btn-danger" onclick="rejectPayout('${p.id}')" data-action-i18n="reject">${t("reject")}</button>
              </div>`
            : "—";
          html += `<tr>
            <td>${formatDate(p.created_at)}</td>
            <td>${escapeHtml(email)}</td>
            <td>${formatNumber(p.coins_used)}</td>
            <td>${formatRupiah(p.rupiah_amount)}</td>
            <td>${escapeHtml(p.method || "—")}</td>
            <td>${escapeHtml(p.account_number || "—")}</td>
            <td><span class="badge ${statusClass}">${p.status}</span></td>
            <td>${actions}</td>
          </tr>`;
        });

        html += `</tbody></table></div>`;
        wrap.innerHTML = html;
      } catch (err) {
        console.error("Payouts error:", err);
        wrap.innerHTML = `<div class="empty-state">${t("errorGeneral")}: ${escapeHtml(err.message)}</div>`;
        showToast(t("errorGeneral") + ": " + err.message, "error");
      }
    }

    window.approvePayout = async function (payoutId) {
      if (!window.confirm(t("confirmApprove"))) return;
      const payout = payoutsCache.find(p => p.id === payoutId);
      if (!payout) return;

      try {
        // 1. Update payouts
        const { error: updErr } = await supabase
          .from("payouts")
          .update({ status: "approved", processed_at: new Date().toISOString() })
          .eq("id", payoutId);
        if (updErr) throw updErr;

        // 2. Insert admin_logs
        await supabase.from("admin_logs").insert({
          admin_id: currentUser.id,
          action: "approve_payout",
          target_id: payoutId,
          notes: "Approved"
        });

        showToast(t("successApprove"), "success");
        loadPayouts();
        loadStats();
      } catch (err) {
        console.error("Approve error:", err);
        showToast(t("errorGeneral") + ": " + err.message, "error");
      }
    };

    window.rejectPayout = async function (payoutId) {
      const reason = window.prompt(t("rejectReason"));
      if (!reason || reason.trim() === "") return;
      const payout = payoutsCache.find(p => p.id === payoutId);
      if (!payout) return;

      try {
        // 1. Update payouts
        const { error: updErr } = await supabase
          .from("payouts")
          .update({ status: "rejected", processed_at: new Date().toISOString() })
          .eq("id", payoutId);
        if (updErr) throw updErr;

        // 2. Kembalikan koin ke user
        const { data: userRow, error: getErr } = await supabase
          .from("users").select("coin_balance").eq("id", payout.user_id).single();
        if (getErr) throw getErr;
        const newBalance = (Number(userRow.coin_balance) || 0) + (Number(payout.coins_used) || 0);

        const { error: balErr } = await supabase
          .from("users").update({ coin_balance: newBalance }).eq("id", payout.user_id);
        if (balErr) throw balErr;

        // 3. Insert coin_transactions
        await supabase.from("coin_transactions").insert({
          user_id: payout.user_id,
          amount: payout.coins_used,
          type: "payout",
          description: "Refund payout ditolak: " + reason.trim()
        });

        // 4. Insert admin_logs
        await supabase.from("admin_logs").insert({
          admin_id: currentUser.id,
          action: "reject_payout",
          target_id: payoutId,
          notes: reason.trim()
        });

        showToast(t("successReject"), "success");
        loadPayouts();
        loadStats();
      } catch (err) {
        console.error("Reject error:", err);
        showToast(t("errorGeneral") + ": " + err.message, "error");
      }
    };

    // ==================== 3. USERS ====================
    async function loadUsers() {
      const wrap = document.getElementById("usersTableWrap");
      wrap.innerHTML = `<div class="empty-state">${t("loading")}</div>`;
      const search = document.getElementById("userSearch").value.trim().toLowerCase();

      try {
        let query = supabase
          .from("users")
          .select("id, email, role, coin_balance, coin_pending, status, last_login_at, device_fingerprint, phone, coin_expiry_at, created_at")
          .order("created_at", { ascending: false });

        const { data, error } = await query;
        if (error) throw error;
        usersCache = data || [];

        const filtered = search
          ? usersCache.filter(u => (u.email || "").toLowerCase().includes(search))
          : usersCache;

        if (filtered.length === 0) {
          wrap.innerHTML = `<div class="empty-state">${t("noUser")}</div>`;
          return;
        }

        let html = `<div class="table-wrap"><table><thead><tr>
          <th>${t("tableEmail")}</th>
          <th>${t("tableRole")}</th>
          <th>${t("tableBalance")}</th>
          <th>${t("tablePending")}</th>
          <th>${t("tableStatus")}</th>
          <th>${t("tableLastLogin")}</th>
          <th>${t("tableAction")}</th>
        </tr></thead><tbody>`;

        filtered.forEach(u => {
          const roleClass = u.role === "admin" ? "badge-admin" : "badge-user";
          html += `<tr>
            <td>${escapeHtml(u.email || "—")}</td>
            <td><span class="badge ${roleClass}">${u.role || "user"}</span></td>
            <td>${formatNumber(u.coin_balance)}</td>
            <td>${formatNumber(u.coin_pending)}</td>
            <td>${escapeHtml(u.status || "—")}</td>
            <td>${formatDate(u.last_login_at)}</td>
            <td><button class="btn-sm btn-ghost" onclick="showUserDetail('${u.id}')" data-action-i18n="detail">${t("detail")}</button></td>
          </tr>`;
        });

        html += `</tbody></table></div>`;
        wrap.innerHTML = html;
      } catch (err) {
        console.error("Users error:", err);
        wrap.innerHTML = `<div class="empty-state">${t("errorGeneral")}: ${escapeHtml(err.message)}</div>`;
        showToast(t("errorGeneral") + ": " + err.message, "error");
      }
    }

    window.showUserDetail = function (userId) {
      const u = usersCache.find(x => x.id === userId);
      if (!u) return;

      const container = document.getElementById("modalContainer");
      container.innerHTML = `
        <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
          <div class="modal-box">
            <h3>👤 ${t("detail")}</h3>
            <div class="modal-detail"><span class="k">${t("modalEmail")}</span><span class="v">${escapeHtml(u.email || "—")}</span></div>
            <div class="modal-detail"><span class="k">${t("modalRole")}</span><span class="v">${escapeHtml(u.role || "—")}</span></div>
            <div class="modal-detail"><span class="k">${t("modalBalance")}</span><span class="v">${formatNumber(u.coin_balance)}</span></div>
            <div class="modal-detail"><span class="k">${t("modalPending")}</span><span class="v">${formatNumber(u.coin_pending)}</span></div>
            <div class="modal-detail"><span class="k">${t("modalDevice")}</span><span class="v">${escapeHtml(u.device_fingerprint || "—")}</span></div>
            <div class="modal-detail"><span class="k">${t("modalPhone")}</span><span class="v">${escapeHtml(u.phone || "—")}</span></div>
            <div class="modal-detail"><span class="k">${t("modalLastLogin")}</span><span class="v">${formatDate(u.last_login_at)}</span></div>
            <div class="modal-detail"><span class="k">${t("modalCoinExpiry")}</span><span class="v">${formatDate(u.coin_expiry_at)}</span></div>
            <div class="modal-detail"><span class="k">${t("modalCreated")}</span><span class="v">${formatDate(u.created_at)}</span></div>
            <button class="btn-primary modal-close" onclick="closeModal()">${t("close")}</button>
          </div>
        </div>`;
    };

    window.closeModal = function () {
      document.getElementById("modalContainer").innerHTML = "";
    };

    // ==================== 4. SETTINGS ====================
    const SETTING_KEYS = [
      "monetag_links", "adsterra_link", "reward_per_ad", "daily_limit",
      "conversion_fee_percent", "checkin_min", "checkin_max",
      "coin_rate", "coin_expiry_days"
    ];

    async function loadSettings() {
      try {
        const { data, error } = await supabase
          .from("settings")
          .select("key, value, updated_at")
          .in("key", SETTING_KEYS);
        if (error) throw error;

        const map = {};
        let latestUpdate = null;
        (data || []).forEach(row => {
          map[row.key] = row.value;
          if (row.updated_at && (!latestUpdate || row.updated_at > latestUpdate)) {
            latestUpdate = row.updated_at;
          }
        });

        SETTING_KEYS.forEach(key => {
          const el = document.getElementById("set_" + key);
          if (el && map[key] != null) {
            el.value = map[key];
          }
        });

        document.getElementById("settingsUpdatedAt").textContent = latestUpdate
          ? `${t("lastUpdated")}: ${formatDate(latestUpdate)}`
          : "";
      } catch (err) {
        console.error("Settings load error:", err);
        showToast(t("errorGeneral") + ": " + err.message, "error");
      }
    }

    async function saveSettings(e) {
      e.preventDefault();
      const btn = document.getElementById("saveSettingsBtn");
      btn.disabled = true;
      const originalText = btn.textContent;
      btn.innerHTML = `<span class="loading-spinner"></span> ${t("processing")}`;

      try {
        const upserts = SETTING_KEYS.map(key => {
          const el = document.getElementById("set_" + key);
          return {
            key,
            value: el ? el.value : "",
            updated_at: new Date().toISOString()
          };
        });

        // Upsert: on conflict key update
        const { error } = await supabase
          .from("settings")
          .upsert(upserts, { onConflict: "key" });
        if (error) throw error;

        showToast(t("successSettings"), "success");
        loadSettings();
      } catch (err) {
        console.error("Settings save error:", err);
        showToast(t("errorGeneral") + ": " + err.message, "error");
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }

    // ==================== INISIALISASI ====================
    document.addEventListener("DOMContentLoaded", async () => {
      // Terapkan bahasa awal
      applyLanguage();

      // Cek auth & role
      const ok = await checkAuthAndRole();
      if (!ok) return;

      // Routing
      initRouting();

      // Event: logout
      document.getElementById("logoutBtn").addEventListener("click", async () => {
        await supabase.auth.signOut();
        window.location.href = "index.html#login";
      });

      // Event: ganti bahasa
      document.getElementById("langId").addEventListener("click", () => {
        currentLang = "id";
        localStorage.setItem("lang", "id");
        applyLanguage();
        // Refresh konten halaman aktif
        const activePage = window.location.hash.replace("#", "") || "stats";
        showPage(activePage);
      });
      document.getElementById("langEn").addEventListener("click", () => {
        currentLang = "en";
        localStorage.setItem("lang", "en");
        applyLanguage();
        const activePage = window.location.hash.replace("#", "") || "stats";
        showPage(activePage);
      });

      // Event: filter payout
      document.getElementById("payoutFilter").addEventListener("change", loadPayouts);
      document.getElementById("refreshPayoutsBtn").addEventListener("click", loadPayouts);

      // Event: search user
      document.getElementById("userSearch").addEventListener("input", loadUsers);
      // Event: refresh stats
      document.getElementById("refreshStatsBtn").addEventListener("click", loadStats);

      // Event: submit settings
      document.getElementById("settingsForm").addEventListener("submit", saveSettings);

      // Muat halaman default
      const hash = window.location.hash.replace("#", "");
      showPage(PAGES.includes(hash) ? hash : "stats");
    });
  </script>
</body>
