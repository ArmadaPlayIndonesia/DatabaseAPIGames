    var WA_ADMIN = '6283191125094';

      noWA: null,
      nama: '-',
      totalKunjungan: 0,
      status: 'Proses',
      progres: 0,
      pesan: '',
      terakhirCuci: '—',
      riwayat: [],
      produk: [
        { nama: 'Kain Mikrofiber', harga: 'Rp10.000', emoji: '🧽', shopee: '#' },

        { nama: 'Pengilap', harga: 'Rp12.000', emoji: '✨', shopee: '#' }
      ]

    // ===== UTILITAS =====
    function $(id) { return document.getElementById(id); }

    function showLoading() { $('loading').classList.remove('hidden'); }
    function hideLoading() { $('loading').classList.add('hidden'); }

    function toast(msg) {
      var t = $('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._timer);
      t._timer = setTimeout(function() { t.classList.remove('show'); }, 2500);
    }

    function formatTanggal(iso) {
      if (!iso) return '—';
      try {
        var d = new Date(iso);
        if (isNaN(d.getTime())) return iso;
        var bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
        return d.getDate() + ' ' + bulan[d.getMonth()] + ' ' + d.getFullYear();
      } catch (e) { return iso; }
    }

    // ===== API CALL =====
    async function panggilAppsScript(payload) {
      var response = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      var text = await response.text();
      return JSON.parse(text);
    }

    // ===== VALIDASI NOMOR =====
    function validasiNomor(no) {
      if (!no || no.length === 0) return 'Nomor WhatsApp wajib diisi!';
      if (no[0] !== '0') return 'Format nomor harus pakai 0 di depan ya!';
      if (!/^[0-9]+$/.test(no)) return 'Nomor hanya boleh berisi angka!';
      if (no.length < 10 || no.length > 13) return 'Panjang nomor harus 10-13 digit!';
      return null;
    }

    // ===== LOGIN =====
    async function login(noWA) {
      showLoading();
      try {
        var res = await panggilAppsScript({ action: 'cekProgres', noWA: noWA });
        hideLoading();

        if (res && res.success) {
          state.noWA = noWA;
          state.nama = res.nama || 'Pelanggan';
          state.totalKunjungan = res.totalKunjungan || 0;
          state.status = res.status || 'Proses';
          state.progres = res.progres || (state.totalKunjungan % 10);
          state.pesan = res.pesan || '';
          state.terakhirCuci = res.terakhirCuci || '—';
          state.riwayat = res.riwayat || [];

          localStorage.setItem('steam_mp_noWA', noWA);
          localStorage.setItem('steam_mp_data', JSON.stringify(res));

          tampilkanApp();
          renderHome();
        } else {
          var errMsg = (res && res.message) ? res.message : 'Nomor tidak ditemukan. Pastikan sudah pernah cuci di Steam MP 7000.';

          $('inputWA').classList.add('error');

        hideLoading();
        console.error('Login error:', e);
        $('errorWA').textContent = 'Gagal terhubung ke server. Coba lagi ya!';
        $('inputWA').classList.add('error');
      }
    }

      gantiHalaman('home');
    }

    // ===== RENDER HOME =====
    function renderHome() {
      var s = state;
      $('sapaan').textContent = 'Halo, ' + s.nama + '! 👋';

      var total = s.totalKunjungan || 0;
      var progres = total % 10;
      // Jika total > 0 dan progres == 0, artinya sudah 10x (gratis)
      if (total > 0 && progres === 0) progres = 10;

      var persen = (progres / 10) * 100;
      $('progressFill').style.width = persen + '%';

      if (total === 0) {
        $('progressTeks').textContent = 'Kunjungan ke-0 dari 10';
        $('progressPesan').textContent = 'Ayo mulai cuci motor! 💨';
      } else if (progres >= 10) {
        $('progressTeks').textContent = 'Kunjungan ke-10 dari 10';
        $('progressPesan').textContent = 'Selamat! Kamu dapat 1x cuci GRATIS! 🎉';
      } else {
        $('progressTeks').textContent = 'Kunjungan ke-' + progres + ' dari 10';
        var sisa = 10 - progres;
        $('progressPesan').textContent = 'Tinggal ' + sisa + 'x lagi gratis! 💨';
      }

      if (s.pesan) {
        $('progressPesan').textContent = s.pesan;
      }

      $('infoTerakhir').textContent = 'Terakhir cuci: ' + formatTanggal(s.terakhirCuci);
    }

    // ===== RENDER PRODUK =====
    function renderProduk() {
      var grid = $('produkGrid');
      grid.innerHTML = '';

      state.produk.forEach(function(p) {
        var waText = encodeURIComponent('Halo, saya mau ambil ' + p.nama + ' di toko');
        var waLink = 'https://wa.me/' + WA_ADMIN + '?text=' + waText;

        var div = document.createElement('div');
        div.className = 'produk-item';
        div.innerHTML =
          '<div class="produk-foto">' + p.emoji + '</div>' +
          '<div class="produk-info">' +
            '<div class="produk-nama">' + p.nama + '</div>' +
            '<div class="produk-harga">' + p.harga + '</div>' +
            '<div class="produk-aksi">' +
              '<a class="btn-kecil btn-ambil" href="' + waLink + '" target="_blank" rel="noopener">Ambil di Toko</a>' +
              '<a class="btn-kecil btn-online" href="' + p.shopee + '" target="_blank" rel="noopener">Beli Online</a>' +
            '</div>' +
          '</div>';
        grid.appendChild(div);
      });
    }

    // ===== RENDER RIWAYAT =====
    function renderRiwayat() {
      var list = $('riwayatList');
      list.innerHTML = '';

      if (!state.riwayat || state.riwayat.length === 0) {
        list.innerHTML = '<div class="empty-state">Belum ada riwayat cuci.<br>Ayo cuci motor pertamamu! 🏍️</div>';
        return;
      }

      state.riwayat.forEach(function(r) {
        var div = document.createElement('div');
        div.className = 'riwayat-item';
        div.innerHTML =
          '<div class="riwayat-kiri">' +
            '<div class="riwayat-tanggal">' + formatTanggal(r.tanggal) + '</div>' +
            '<div class="riwayat-detail">' + (r.jenisMotor || 'Motor') + '</div>' +
          '</div>' +
          '<div class="riwayat-plat">' + (r.plat || '—') + '</div>';
        list.appendChild(div);
      });
    }

    // ===== RENDER PROFIL =====
    function renderProfil() {
      var card = $('profilCard');
      var s = state;

      var badgeClass = 'badge-proses';
      if (s.status === 'Siap Gratis') badgeClass = 'badge-siap';
      else if (s.status === 'Gratis') badgeClass = 'badge-gratis';

      card.innerHTML =
        '<div class="profil-row">' +
          '<span class="profil-label">Nama</span>' +
          '<span class="profil-nilai">' + s.nama + '</span>' +
        '</div>' +
        '<div class="profil-row">' +
          '<span class="profil-label">No WhatsApp</span>' +
          '<span class="profil-nilai">' + (s.noWA || '-') + '</span>' +
        '</div>' +
        '<div class="profil-row">' +
          '<span class="profil-label">Total Kunjungan</span>' +
          '<span class="profil-nilai">' + (s.totalKunjungan || 0) + 'x</span>' +
        '</div>' +
        '<div class="profil-row">' +
          '<span class="profil-label">Status</span>' +
          '<span class="profil-nilai"><span class="badge-status ' + badgeClass + '">' + s.status + '</span></span>' +
        '</div>';

      $('btnHubungi').href = 'https://wa.me/' + WA_ADMIN;
    }

    // ===== NAVIGASI =====
    function gantiHalaman(nama) {
      var pages = ['home', 'produk', 'riwayat', 'profil'];
      pages.forEach(function(p) {
        var el = $('page' + p.charAt(0).toUpperCase() + p.slice(1));
        if (el) {
          if (p === nama) el.classList.remove('hidden');
          else el.classList.add('hidden');
        }
      });

      // Update nav aktif
      document.querySelectorAll('.nav-item').forEach(function(btn) {
        if (btn.getAttribute('data-page') === nama) btn.classList.add('aktif');
        else btn.classList.remove('aktif');
      });

      // Scroll ke atas
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ===== LOGOUT =====
    function logout() {
      localStorage.removeItem('steam_mp_noWA');
      localStorage.removeItem('steam_mp_data');
      state.noWA = null;
      state.nama = '-';
      state.totalKunjungan = 0;
      state.status = 'Proses';
      state.progres = 0;
      state.pesan = '';
      state.terakhirCuci = '—';
      state.riwayat = [];
      tampilkanLogin();
      toast('Berhasil logout');
    }

    // ===== INIT =====
    function init() {
      // Cek localStorage
      var noWA = localStorage.getItem('steam_mp_noWA');
      var dataStr = localStorage.getItem('steam_mp_data');

      if (noWA) {
        state.noWA = noWA;
        if (dataStr) {
          try {
            var data = JSON.parse(dataStr);
            state.nama = data.nama || 'Pelanggan';
            state.totalKunjungan = data.totalKunjungan || 0;
            state.status = data.status || 'Proses';
            state.progres = data.progres || 0;
            state.pesan = data.pesan || '';
            state.terakhirCuci = data.terakhirCuci || '—';
            state.riwayat = data.riwayat || [];
          } catch (e) { /* abaikan */ }
        }
        tampilkanApp();

        // Refresh data dari server di background
        panggilAppsScript({ action: 'cekProgres', noWA: noWA })
          .then(function(res) {
            if (res && res.success) {
              state.nama = res.nama || 'Pelanggan';
              state.totalKunjungan = res.totalKunjungan || 0;
              state.status = res.status || 'Proses';
              state.progres = res.progres || 0;
              state.pesan = res.pesan || '';
              state.terakhirCuci = res.terakhirCuci || '—';
              state.riwayat = res.riwayat || [];
              localStorage.setItem('steam_mp_data', JSON.stringify(res));
              renderHome();
              renderProfil();
              renderRiwayat();
            }
          })
          .catch(function() { /* offline: pakai data lokal */ });
      } else {
        tampilkanLogin();
      }

      // ===== EVENT: Login =====
      $('btnLihatProgres').addEventListener('click', function() {
        var no = $('inputWA').value.trim();
        $('errorWA').textContent = '';
        $('inputWA').classList.remove('error');

        var err = validasiNomor(no);
        if (err) {
          $('errorWA').textContent = err;
          $('inputWA').classList.add('error');
          return;
        }

        login(no);
      });

      // Enter di input
      $('inputWA').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') $('btnLihatProgres').click();
      });

      // Hapus error saat mengetik
      $('inputWA').addEventListener('input', function() {
        $('errorWA').textContent = '';
        $('inputWA').classList.remove('error');
      });

      // ===== EVENT: Bottom Nav =====
      document.querySelectorAll('.nav-item').forEach(function(btn) {
        btn.addEventListener('click', function() {
          gantiHalaman(this.getAttribute('data-page'));
        });
      });

      // ===== EVENT: Logout =====
      $('btnLogoutHeader').addEventListener('click', logout);
      $('btnLogoutProfil').addEventListener('click', logout);

      // ===== EVENT: Tonton Iklan =====
      $('btnTontonIklan').addEventListener('click', function() {
        window.open(IKLAN_URL_MONETAG, '_blank');
      });
    }

    // Jalankan
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

  </script>
</body>
</html>
