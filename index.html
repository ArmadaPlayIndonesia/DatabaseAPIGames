<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌱 Growtopia-like Sandbox</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      font-family: 'Courier New', monospace;
    }
    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #gameContainer {
      position: relative;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
      border-radius: 12px;
      overflow: hidden;
      border: 3px solid #4a4a6a;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #87CEEB;
      cursor: crosshair;
    }
    /* HUD */
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      pointer-events: none;
      z-index: 10;
      font-size: 14px;
      color: white;
      text-shadow: 2px 2px 0 #000;
    }
    .hud-item {
      background: rgba(0,0,0,0.7);
      padding: 6px 12px;
      border-radius: 6px;
      border: 2px solid #555;
      backdrop-filter: blur(4px);
    }
    #playerName {
      color: #7fff7f;
      font-weight: bold;
    }
    .locked-icon {
      color: #ffd700;
      font-size: 18px;
    }
    /* Hotbar */
    #hotbar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      pointer-events: none;
      z-index: 10;
    }
    .hotbar-slot {
      width: 52px;
      height: 52px;
      background: rgba(0,0,0,0.75);
      border: 3px solid #666;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      color: white;
      font-size: 11px;
      text-shadow: 1px 1px 0 #000;
    }
    .hotbar-slot.active {
      border-color: #ffd700;
      box-shadow: 0 0 12px #ffd70088;
    }
    .hotbar-slot .key {
      position: absolute;
      top: -6px;
      left: 2px;
      font-size: 10px;
      background: #333;
      padding: 0 4px;
      border-radius: 3px;
      color: #aaa;
    }
    .hotbar-slot .item-icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hotbar-slot .count {
      font-size: 10px;
      color: #7fff7f;
      font-weight: bold;
    }
    /* Panels */
    .panel {
      position: absolute;
      background: rgba(20,20,40,0.95);
      border: 3px solid #666;
      border-radius: 12px;
      padding: 16px;
      color: white;
      z-index: 20;
      display: none;
      max-height: 60vh;
      overflow-y: auto;
      font-size: 14px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 30px rgba(0,0,0,0.9);
    }
    .panel.open { display: block; }
    .panel h2 { color: #ffd700; margin-bottom: 12px; font-size: 18px; border-bottom: 2px solid #444; padding-bottom: 8px; }
    .panel .close-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      cursor: pointer;
      color: #ff6666;
      font-size: 20px;
      pointer-events: auto;
    }
    /* Inventory grid */
    #inventoryPanel {
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 480px;
    }
    .inv-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }
    .inv-slot {
      background: rgba(0,0,0,0.5);
      border: 2px solid #555;
      border-radius: 6px;
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      cursor: pointer;
      pointer-events: auto;
      transition: border-color 0.1s;
      position: relative;
    }
    .inv-slot:hover { border-color: #ffd700; }
    .inv-slot .item-icon { width: 28px; height: 28px; }
    .inv-slot .item-name { font-size: 9px; text-align: center; line-height: 1; margin-top: 2px; }
    .inv-slot .item-count { color: #7fff7f; font-weight: bold; }
    /* Recipe panel */
    #recipePanel {
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 560px;
    }
    .recipe-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .recipe-item {
      background: rgba(0,0,0,0.4);
      border: 2px solid #444;
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    .recipe-item .result { color: #7fff7f; font-weight: bold; margin-left: auto; }
    /* Chat */
    #chatPanel {
      bottom: 90px;
      left: 10px;
      width: 380px;
      max-height: 200px;
      padding: 10px 14px;
    }
    #chatLog {
      max-height: 120px;
      overflow-y: auto;
      margin-bottom: 8px;
      font-size: 12px;
      line-height: 1.5;
    }
    #chatLog div { color: #ddd; }
    #chatLog .cmd { color: #7fff7f; }
    #chatInput {
      width: 100%;
      padding: 8px;
      background: #111;
      border: 2px solid #555;
      border-radius: 6px;
      color: white;
      font-family: inherit;
      font-size: 13px;
      pointer-events: auto;
      outline: none;
    }
    #chatInput:focus { border-color: #ffd700; }
    /* Messages */
    #messages {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }
    .msg {
      background: rgba(0,0,0,0.85);
      color: #ffdd44;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 14px;
      border: 2px solid #ffd70066;
      animation: fadeOut 2.5s forwards;
      text-shadow: 1px 1px 0 #000;
    }
    @keyframes fadeOut {
      0% { opacity: 1; transform: translateY(0); }
      70% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-20px); }
    }
    /* Controls hint */
    #controlsHint {
      position: absolute;
      bottom: 80px;
      right: 10px;
      background: rgba(0,0,0,0.6);
      padding: 8px 12px;
      border-radius: 8px;
      color: #aaa;
      font-size: 11px;
      z-index: 10;
      pointer-events: none;
      line-height: 1.6;
      border: 1px solid #444;
    }
    #controlsHint b { color: #ffd700; }
    /* FPS */
    #fpsDisplay {
      position: absolute;
      top: 10px;
      right: 10px;
      color: #7fff7f;
      font-size: 12px;
      background: rgba(0,0,0,0.6);
      padding: 4px 10px;
      border-radius: 6px;
      z-index: 10;
    }
    /* Background mode indicator */
    #bgModeIndicator {
      position: absolute;
      top: 50px;
      right: 10px;
      background: rgba(100,50,200,0.8);
      color: white;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
      z-index: 10;
      border: 2px solid #a070ff;
    }
    #bgModeIndicator.active { display: block; }
  </style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas" width="960" height="540"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-item" id="gemsHud">💎 <span id="gemsCount">0</span> Gems</div>
    <div class="hud-item" id="lockHud">🔒 <span id="lockCount">0</span> World Lock</div>
    <div class="hud-item" id="coordHud">📍 <span id="coordText">0, 0</span></div>
    <div class="hud-item" id="playerName">👤 Player</div>
  </div>
  <div id="fpsDisplay">FPS: <span id="fpsCount">0</span></div>
  <div id="bgModeIndicator">🖼️ BACKGROUND MODE (B)</div>

  <!-- Hotbar -->
  <div id="hotbar"></div>

  <!-- Inventory panel -->
  <div class="panel" id="inventoryPanel">
    <span class="close-btn" onclick="toggleInventory()">✕</span>
    <h2>🎒 Inventory</h2>
    <div class="inv-grid" id="invGrid"></div>
  </div>

  <!-- Recipe panel -->
  <div class="panel" id="recipePanel">
    <span class="close-btn" onclick="toggleRecipes()">✕</span>
    <h2>🧪 Splicing Recipes</h2>
    <div class="recipe-list" id="recipeList"></div>
  </div>

  <!-- Chat panel -->
  <div class="panel" id="chatPanel">
    <span class="close-btn" onclick="toggleChat()">✕</span>
    <h2>💬 Chat</h2>
    <div id="chatLog"></div>
    <input type="text" id="chatInput" placeholder="Type /help for commands..." autocomplete="off">
  </div>

  <!-- Messages -->
  <div id="messages"></div>

  <!-- Controls hint -->
  <div id="controlsHint">
    <b>A/D</b> Move &nbsp; <b>W</b> Jump &nbsp; <b>SPACE</b> Punch<br>
    <b>E</b>/RMB Place &nbsp; <b>B</b> BG Mode &nbsp; <b>1-8</b> Hotbar<br>
    <b>I</b> Inventory &nbsp; <b>R</b> Recipes &nbsp; <b>T</b> Chat
  </div>
</div>

<script>
// ============================================================
//  GROWTOPIA-LIKE SANDBOX GAME
//  Single file, Canvas pixel art, localStorage save
// ============================================================

// ---------- CONSTANTS ----------
const TILE = 32;
const WORLD_W = 120;
const WORLD_H = 70;
const BEDROCK_LAYERS = 6; // bottom 6 rows are bedrock
const GRAVITY = 0.55;
const JUMP_FORCE = -9.5;
const MOVE_SPEED = 3.8;
const PUNCH_RANGE = 1; // tiles ahead
const PUNCH_COOLDOWN = 18; // frames
const SPLICE_TIME = 300; // 5 seconds at 60fps
const SAVE_KEY = 'growtopia_sandbox_save_v1';

// ---------- TILE DEFINITIONS ----------
const TILE_TYPES = {
  EMPTY: 0,
  DIRT: 1,
  ROCK: 2,
  GRASS: 3,
  SAND: 4,
  WOOD: 5,
  GLASS: 6,
  LAVA: 7,
  WATER: 8,
  BRICK: 9,
  BEDROCK: 10,
  WHITE_DOOR: 11,
  TREE_TRUNK: 12,
  TREE_LEAVES: 13,
  SANDSTONE: 14,
  STONE: 15,
};

const TILE_NAMES = {
  0: 'Empty', 1: 'Dirt', 2: 'Rock', 3: 'Grass', 4: 'Sand', 5: 'Wood Block',
  6: 'Glass', 7: 'Lava', 8: 'Water', 9: 'Brick', 10: 'Bedrock',
  11: 'White Door', 12: 'Tree Trunk', 13: 'Tree Leaves', 14: 'Sandstone', 15: 'Stone'
};

const BG_TYPES = {
  NONE: 0,
  CAVE_BG: 1,
  WOODEN_BG: 2,
  BLUE_WALLPAPER: 3,
  RED_WALLPAPER: 4,
};

const BG_NAMES = {
  0: 'None', 1: 'Cave Background', 2: 'Wooden Background',
  3: 'Blue Wallpaper', 4: 'Red Wallpaper'
};

// Colors for foreground tiles (base, highlight, shadow)
const TILE_COLORS = {
  1: { base: '#8B5A2B', hi: '#A0703B', sh: '#6B3A1B' }, // dirt
  2: { base: '#808080', hi: '#A0A0A0', sh: '#606060' }, // rock
  3: { base: '#4CAF50', hi: '#6BD86F', sh: '#35853A' }, // grass
  4: { base: '#E8D068', hi: '#F5E88A', sh: '#C8B040' }, // sand
  5: { base: '#A0703B', hi: '#C0904B', sh: '#705020' }, // wood
  6: { base: '#5B9BD5', hi: '#7BBBF5', sh: '#3B7BB5' }, // glass
  7: { base: '#FF4500', hi: '#FF7733', sh: '#CC3300' }, // lava
  8: { base: '#1E90FF', hi: '#4EA8FF', sh: '#0050CC' }, // water
  9: { base: '#B33A3A', hi: '#D06060', sh: '#802020' }, // brick
  10: { base: '#3A3A4A', hi: '#5A5A6A', sh: '#1A1A2A' }, // bedrock
  11: { base: '#F0F0F0', hi: '#FFFFFF', sh: '#C0C0C0' }, // white door
  12: { base: '#6B4226', hi: '#8B6246', sh: '#4B2210' }, // tree trunk
  13: { base: '#2E7D32', hi: '#4CAF50', sh: '#1B5E20' }, // tree leaves
  14: { base: '#C8B060', hi: '#E0C880', sh: '#A89040' }, // sandstone
  15: { base: '#707070', hi: '#909090', sh: '#505050' }, // stone
};

const BG_COLORS = {
  1: { base: '#2A2A3A', hi: '#3A3A4A' }, // cave bg
  2: { base: '#5A3A1A', hi: '#6A4A2A' }, // wooden bg
  3: { base: '#2A3A6A', hi: '#3A4A7A' }, // blue wallpaper
  4: { base: '#6A2A2A', hi: '#7A3A3A' }, // red wallpaper
};

// Solid tiles (block movement)
const SOLID_TILES = new Set([1,2,3,4,5,6,9,10,11,12,14,15]);
// Punchable tiles
const PUNCHABLE = new Set([1,2,3,4,5,6,9,12,13,14,15]);
// Non-breakable
const UNBREAKABLE = new Set([10, 11]);
// Placeable from inventory (item name -> tile type)
const PLACEABLE_ITEMS = {
  'Dirt': 1, 'Rock': 2, 'Grass': 3, 'Sand': 4, 'Wood Block': 5,
  'Glass': 6, 'Lava': 7, 'Water': 8, 'Brick': 9, 'Sandstone': 14, 'Stone': 15,
  'Cave Background': -1, 'Wooden Background': -2, 'Blue Wallpaper': -3, 'Red Wallpaper': -4,
};

// ---------- SPLICING RECIPES (30+) ----------
const RECIPES = [
  { a: 'Dirt', b: 'Rock', result: 'Sand' },
  { a: 'Sand', b: 'Water', result: 'Glass' },
  { a: 'Dirt', b: 'Water', result: 'Grass' },
  { a: 'Rock', b: 'Rock', result: 'Stone' },
  { a: 'Wood Block', b: 'Tree Leaves', result: 'Tree Seed' },
  { a: 'Sand', b: 'Sand', result: 'Sandstone' },
  { a: 'Dirt', b: 'Dirt', result: 'Grass' },
  { a: 'Rock', b: 'Sand', result: 'Sandstone' },
  { a: 'Grass', b: 'Water', result: 'Dirt' },
  { a: 'Brick', b: 'Rock', result: 'Stone' },
  { a: 'Glass', b: 'Sand', result: 'Glass' },
  { a: 'Lava', b: 'Rock', result: 'Brick' },
  { a: 'Lava', b: 'Water', result: 'Rock' },
  { a: 'Wood Block', b: 'Dirt', result: 'Grass' },
  { a: 'Tree Leaves', b: 'Dirt', result: 'Grass' },
  { a: 'Sand', b: 'Rock', result: 'Sandstone' },
  { a: 'Stone', b: 'Stone', result: 'Brick' },
  { a: 'Water', b: 'Grass', result: 'Dirt' },
  { a: 'Lava', b: 'Sand', result: 'Glass' },
  { a: 'Wood Block', b: 'Rock', result: 'Stone' },
  { a: 'Brick', b: 'Brick', result: 'Stone' },
  { a: 'Dirt', b: 'Sand', result: 'Sandstone' },
  { a: 'Grass', b: 'Rock', result: 'Dirt' },
  { a: 'Glass', b: 'Glass', result: 'Glass' },
  { a: 'Sandstone', b: 'Rock', result: 'Stone' },
  { a: 'Tree Leaves', b: 'Water', result: 'Grass' },
  { a: 'Dirt', b: 'Lava', result: 'Brick' },
  { a: 'Rock', b: 'Water', result: 'Sand' },
  { a: 'Wood Block', b: 'Wood Block', result: 'Brick' },
  { a: 'Sand', b: 'Tree Leaves', result: 'Grass' },
  { a: 'Stone', b: 'Sand', result: 'Sandstone' },
  { a: 'Brick', b: 'Water', result: 'Rock' },
];

// ---------- GAME STATE ----------
let canvas, ctx;
let world = []; // { fg, bg, growth: null | {timer, result}, treeData: null | {...} }
let player = {
  x: 50 * TILE, y: 24 * TILE,
  vx: 0, vy: 0,
  w: 20, h: 28,
  onGround: false,
  facing: 1, // 1 right, -1 left
  walkFrame: 0,
  punchTimer: 0,
  punchAnim: 0, // 0 = none, counts down
  alive: true,
};
let camera = { x: 0, y: 0 };
let gems = 0;
let worldLockCount = 0;
let worldLocked = false;
let worldLockTile = null; // {x, y}
let inventory = {}; // itemName -> count
let hotbar = [null, null, null, null, null, null, null, null]; // item names
let hotbarIndex = 0;
let bgMode = false;
let keys = {};
let particles = [];
let floatingTexts = [];
let screenShake = 0;
let lastTime = 0;
let fps = 60;
let frameCount = 0;
let fpsTimer = 0;
let chatOpen = false;
let inventoryOpen = false;
let recipesOpen = false;
let spliceSeeds = []; // for splicing: { item, tileX, tileY }
let gameTime = 0;
let whiteDoorPos = null;
let soundCtx = null;

// ---------- UTILS ----------
function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function distance(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }

// ---------- SOUND (Web Audio API) ----------
function initAudio() {
  if (!soundCtx) {
    try {
      soundCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { soundCtx = null; }
  }
}
function playSound(type) {
  if (!soundCtx) return;
  try {
    const now = soundCtx.currentTime;
    const osc = soundCtx.createOscillator();
    const gain = soundCtx.createGain();
    osc.connect(gain);
    gain.connect(soundCtx.destination);
    gain.gain.setValueAtTime(0.08, now);
    switch (type) {
      case 'punch':
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.start(now); osc.stop(now + 0.12);
        break;
      case 'place':
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(500, now + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
        break;
      case 'harvest':
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
        break;
      case 'error':
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.2);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
        break;
      case 'buy':
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
        break;
    }
  } catch (e) {}
}

// ---------- WORLD GENERATION ----------
function generateWorld() {
  world = [];
  for (let y = 0; y < WORLD_H; y++) {
    world[y] = [];
    for (let x = 0; x < WORLD_W; x++) {
      world[y][x] = { fg: 0, bg: 0, growth: null, treeData: null };
    }
  }

  // Terrain generation: heightmap
  const heights = [];
  let h = 30;
  for (let x = 0; x < WORLD_W; x++) {
    if (x > 0) {
      h += randInt(-2, 2);
      h = clamp(h, 12, 45);
    }
    heights[x] = h;
  }

  // Fill terrain
  for (let x = 0; x < WORLD_W; x++) {
    const surfaceY = heights[x];
    for (let y = surfaceY; y < WORLD_H; y++) {
      if (y >= WORLD_H - BEDROCK_LAYERS) {
        world[y][x].fg = TILE_TYPES.BEDROCK;
      } else if (y === surfaceY) {
        world[y][x].fg = TILE_TYPES.GRASS;
      } else if (y < surfaceY + 4) {
        world[y][x].fg = TILE_TYPES.DIRT;
      } else if (y < surfaceY + 8) {
        world[y][x].fg = TILE_TYPES.ROCK;
      } else {
        world[y][x].fg = TILE_TYPES.ROCK;
      }
    }
    // Background: cave bg underground
    for (let y = surfaceY + 2; y < WORLD_H - BEDROCK_LAYERS; y++) {
      if (world[y][x].fg !== 0) {
        world[y][x].bg = BG_TYPES.CAVE_BG;
      }
    }
  }

  // Sand patches
  for (let i = 0; i < 5; i++) {
    const sx = randInt(5, WORLD_W - 10);
    const sy = heights[sx] + 1;
    for (let dx = 0; dx < 6; dx++) {
      for (let dy = 0; dy < 3; dy++) {
        const x = sx + dx, y = sy + dy;
        if (x < WORLD_W && y < WORLD_H - BEDROCK_LAYERS && y > 0) {
          world[y][x].fg = TILE_TYPES.SAND;
        }
      }
    }
  }

  // Water pools
  for (let i = 0; i < 3; i++) {
    const wx = randInt(10, WORLD_W - 15);
    const wy = heights[wx] + 2;
    for (let dx = 0; dx < 5; dx++) {
      for (let dy = 0; dy < 3; dy++) {
        const x = wx + dx, y = wy + dy;
        if (x < WORLD_W && y < WORLD_H - BEDROCK_LAYERS && y > 0) {
          if (world[y][x].fg !== TILE_TYPES.BEDROCK) {
            world[y][x].fg = TILE_TYPES.WATER;
          }
        }
      }
    }
  }

  // Lava pools (deep)
  for (let i = 0; i < 2; i++) {
    const lx = randInt(10, WORLD_W - 15);
    const ly = WORLD_H - BEDROCK_LAYERS - 5;
    for (let dx = 0; dx < 4; dx++) {
      for (let dy = 0; dy < 3; dy++) {
        const x = lx + dx, y = ly + dy;
        if (x < WORLD_W && y < WORLD_H - BEDROCK_LAYERS && y > 0) {
          world[y][x].fg = TILE_TYPES.LAVA;
        }
      }
    }
  }

  // Some trees
  for (let i = 0; i < 8; i++) {
    const tx = randInt(5, WORLD_W - 5);
    const ty = heights[tx] - 1;
    if (ty > 3 && world[ty][tx].fg === 0) {
      world[ty][tx].fg = TILE_TYPES.TREE_TRUNK;
      world[ty - 1][tx].fg = TILE_TYPES.TREE_LEAVES;
      if (tx > 0) world[ty - 1][tx - 1].fg = TILE_TYPES.TREE_LEAVES;
      if (tx < WORLD_W - 1) world[ty - 1][tx + 1].fg = TILE_TYPES.TREE_LEAVES;
      if (ty - 2 > 0) world[ty - 2][tx].fg = TILE_TYPES.TREE_LEAVES;
    }
  }

  // White Door at random position on the surface
  const doorX = randInt(30, WORLD_W - 30);
  const doorY = heights[doorX] - 1;
  if (doorY > 2) {
    world[doorY][doorX].fg = TILE_TYPES.WHITE_DOOR;
    // Bedrock under door
    if (doorY + 1 < WORLD_H) {
      world[doorY + 1][doorX].fg = TILE_TYPES.BEDROCK;
    }
    whiteDoorPos = { x: doorX, y: doorY };
  }

  // Ensure player spawn is on solid ground
  player.x = 50 * TILE;
  player.y = (heights[50] - 1) * TILE;
  // Find surface at x=50
  for (let y = 0; y < WORLD_H; y++) {
    if (world[y][50].fg !== 0 && SOLID_TILES.has(world[y][50].fg)) {
      player.y = (y - 1) * TILE;
      break;
    }
  }
}

// ---------- SAVE / LOAD ----------
function saveGame() {
  try {
    const saveData = {
      world: world.map(row => row.map(t => ({
        fg: t.fg, bg: t.bg,
        growth: t.growth ? { timer: t.growth.timer, result: t.growth.result } : null,
        treeData: t.treeData ? { ...t.treeData } : null
      }))),
      player: {
        x: player.x, y: player.y, facing: player.facing,
      },
      gems, worldLockCount, worldLocked, worldLockTile,
      inventory: { ...inventory },
      hotbar: [...hotbar],
      whiteDoorPos: whiteDoorPos ? { ...whiteDoorPos } : null,
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
  } catch (e) { /* ignore */ }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || !data.world) return false;

    world = data.world.map(row => row.map(t => ({
      fg: t.fg || 0, bg: t.bg || 0,
      growth: t.growth ? { timer: t.growth.timer, result: t.growth.result } : null,
      treeData: t.treeData || null
    })));

    if (data.player) {
      player.x = data.player.x ?? player.x;
      player.y = data.player.y ?? player.y;
      player.facing = data.player.facing ?? 1;
    }
    gems = data.gems ?? 0;
    worldLockCount = data.worldLockCount ?? 0;
    worldLocked = data.worldLocked ?? false;
    worldLockTile = data.worldLockTile ?? null;
    inventory = data.inventory ?? {};
    hotbar = data.hotbar ?? [null,null,null,null,null,null,null,null];
    while (hotbar.length < 8) hotbar.push(null);
    whiteDoorPos = data.whiteDoorPos ?? null;
    return true;
  } catch (e) { return false; }
}

// ---------- INVENTORY HELPERS ----------
function addItem(name, count = 1) {
  if (!name) return;
  inventory[name] = (inventory[name] || 0) + count;
  updateHotbarUI();
  updateInventoryUI();
  saveGame();
}

function removeItem(name, count = 1) {
  if (!inventory[name] || inventory[name] < count) return false;
  inventory[name] -= count;
  if (inventory[name] <= 0) delete inventory[name];
  updateHotbarUI();
  updateInventoryUI();
  saveGame();
  return true;
}

function hasItem(name, count = 1) {
  return (inventory[name] || 0) >= count;
}

// ---------- PARTICLES ----------
function spawnParticles(tx, ty, color, count = 8) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x: tx * TILE + TILE/2 + rand(-8, 8),
      y: ty * TILE + TILE/2 + rand(-8, 8),
      vx: rand(-3, 3),
      vy: rand(-4, 1),
      life: rand(20, 40),
      maxLife: 40,
      color: color || '#fff',
      size: rand(2, 5)
    });
  }
}

function spawnFloatingText(x, y, text, color) {
  floatingTexts.push({
    x, y, text, color: color || '#ffd700',
    life: 60, maxLife: 60,
    vy: -1.2
  });
}

// ---------- TILE OPERATIONS ----------
function getTile(tx, ty) {
  if (tx < 0 || tx >= WORLD_W || ty < 0 || ty >= WORLD_H) return null;
  return world[ty][tx];
}

function setTile(tx, ty, fg, bg) {
  if (tx < 0 || tx >= WORLD_W || ty < 0 || ty >= WORLD_H) return;
  if (fg !== undefined) world[ty][tx].fg = fg;
  if (bg !== undefined) world[ty][tx].bg = bg;
  saveGame();
}

function isSolid(tx, ty) {
  const t = getTile(tx, ty);
  if (!t || t.fg === 0) return false;
  return SOLID_TILES.has(t.fg);
}

// ---------- PUNCH ----------
function doPunch() {
  if (player.punchTimer > 0) return;
  player.punchTimer = PUNCH_COOLDOWN;
  player.punchAnim = 8;

  const tx = Math.floor((player.x + player.w/2) / TILE) + player.facing * 1;
  const ty = Math.floor((player.y + player.h/2) / TILE);

  const tile = getTile(tx, ty);
  if (!tile) return;

  // Check if tile is empty
  if (tile.fg === 0) {
    // Check for tree growth nearby (splicing)
    return;
  }

  // Unbreakable
  if (UNBREAKABLE.has(tile.fg)) {
    if (tile.fg === TILE_TYPES.BEDROCK) {
      showMessage('⛏️ Terlalu kuat untuk dihancurkan!');
    } else if (tile.fg === TILE_TYPES.WHITE_DOOR) {
      showMessage('🚪 (stand over and punch to use)');
      // Teleport player to door
      player.x = tx * TILE + 6;
      player.y = ty * TILE - player.h;
      player.vy = 0;
    }
    playSound('error');
    screenShake = 4;
    return;
  }

  // Check for tree harvest
  if (tile.treeData && tile.fg === TILE_TYPES.TREE_TRUNK) {
    // Harvest tree
    const result = tile.treeData.result || 'Wood Block';
    addItem(result, 1);
    if (Math.random() < 0.5) addItem('Tree Leaves', 1);
    spawnParticles(tx, ty, '#4CAF50', 12);
    spawnFloatingText(tx * TILE + 16, ty * TILE, '+1 ' + result, '#7fff7f');
    playSound('harvest');
    setTile(tx, ty, 0, tile.bg);
    // Also clear leaves above
    if (ty - 1 >= 0 && world[ty-1][tx].fg === TILE_TYPES.TREE_LEAVES) {
      setTile(tx, ty-1, 0, world[ty-1][tx].bg);
    }
    screenShake = 3;
    return;
  }

  // Regular tile break
  if (PUNCHABLE.has(tile.fg)) {
    const tileName = TILE_NAMES[tile.fg];
    // Drop item (with chance)
    if (Math.random() < 0.8) {
      addItem(tileName, 1);
      spawnFloatingText(tx * TILE + 16, ty * TILE, '+1 ' + tileName, '#ffd700');
    }
    // Chance for gems
    if (Math.random() < 0.3) {
      const g = randInt(1, 3);
      gems += g;
      spawnFloatingText(tx * TILE + 16, ty * TILE - 10, '+' + g + ' Gems', '#00ffcc');
    }
    spawnParticles(tx, ty, TILE_COLORS[tile.fg]?.base || '#fff', 10);
    playSound('punch');
    screenShake = 5;

    // If it's a tree trunk, also clear leaves
    if (tile.fg === TILE_TYPES.TREE_TRUNK && ty - 1 >= 0) {
      if (world[ty-1][tx].fg === TILE_TYPES.TREE_LEAVES) {
        setTile(tx, ty-1, 0, world[ty-1][tx].bg);
      }
    }

    setTile(tx, ty, 0, tile.bg);
    updateHUD();
  }
}

// ---------- PLACE ----------
function placeBlock() {
  const itemName = hotbar[hotbarIndex];
  if (!itemName) { showMessage('❌ No item selected'); playSound('error'); return; }
  if (!hasItem(itemName, 1)) { showMessage('❌ No ' + itemName + ' left!'); playSound('error'); return; }

  // Determine target tile (in front of player)
  const tx = Math.floor((player.x + player.w/2) / TILE) + player.facing * 1;
  const ty = Math.floor((player.y + player.h/2) / TILE);

  const tile = getTile(tx, ty);
  if (!tile) { showMessage('❌ Out of bounds'); playSound('error'); return; }

  // Check if the tile is the world lock tile
  if (worldLocked && worldLockTile && worldLockTile.x === tx && worldLockTile.y === ty) {
    showMessage('🔒 Cannot modify world lock!');
    playSound('error');
    return;
  }

  // Background mode
  if (bgMode) {
    const bgMap = {
      'Cave Background': BG_TYPES.CAVE_BG,
      'Wooden Background': BG_TYPES.WOODEN_BG,
      'Blue Wallpaper': BG_TYPES.BLUE_WALLPAPER,
      'Red Wallpaper': BG_TYPES.RED_WALLPAPER,
    };
    if (bgMap[itemName] !== undefined) {
      tile.bg = bgMap[itemName];
      removeItem(itemName, 1);
      playSound('place');
      spawnParticles(tx, ty, '#a070ff', 6);
      saveGame();
      updateHUD();
    } else {
      showMessage('❌ Not a background item!');
      playSound('error');
    }
    return;
  }

  // Foreground placement
  const tileType = PLACEABLE_ITEMS[itemName];
  if (tileType === undefined || tileType < 0) {
    showMessage('❌ Cannot place ' + itemName + ' here!');
    playSound('error');
    return;
  }

  // Cannot place on occupied foreground
  if (tile.fg !== 0) {
    showMessage('❌ Tile already occupied!');
    playSound('error');
    return;
  }

  // Check if placing solid would overlap player
  if (SOLID_TILES.has(tileType)) {
    const tileRect = { x: tx * TILE, y: ty * TILE, w: TILE, h: TILE };
    const playerRect = { x: player.x, y: player.y, w: player.w, h: player.h };
    if (rectsOverlap(tileRect, playerRect)) {
      showMessage('❌ Cannot place inside yourself!');
      playSound('error');
      return;
    }
  }

  tile.fg = tileType;
  removeItem(itemName, 1);
  playSound('place');
  spawnParticles(tx, ty, TILE_COLORS[tileType]?.base || '#fff', 6);
  saveGame();
  updateHUD();
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// ---------- SPLICING ----------
function trySplice() {
  // Check if we have exactly 2 seeds selected from inventory
  // We'll use a simpler approach: spliceSeeds holds seed items
  if (spliceSeeds.length !== 2) {
    showMessage('🌱 Select 2 seeds first (from inventory)');
    return;
  }

  // Find the two tiles adjacent to the player
  const ptx = Math.floor((player.x + player.w/2) / TILE);
  const pty = Math.floor((player.y + player.h/2) / TILE);

  // Check tiles around player for empty spots
  const candidates = [
    { x: ptx - 1, y: pty },
    { x: ptx + 1, y: pty },
    { x: ptx, y: pty - 1 },
    { x: ptx, y: pty + 1 },
  ];

  const validSpots = candidates.filter(c => {
    const t = getTile(c.x, c.y);
    return t && t.fg === 0 && !t.growth && c.y < WORLD_H - BEDROCK_LAYERS;
  });

  if (validSpots.length < 2) {
    showMessage('🌱 Need 2 empty adjacent tiles!');
    return;
  }

  // Check recipe
  const recipe = RECIPES.find(r =>
    (r.a === spliceSeeds[0] && r.b === spliceSeeds[1]) ||
    (r.a === spliceSeeds[1] && r.b === spliceSeeds[0])
  );

  if (!recipe) {
    showMessage('❌ No recipe for ' + spliceSeeds[0] + ' + ' + spliceSeeds[1]);
    playSound('error');
    spliceSeeds = [];
    return;
  }

  // Plant seeds
  const spot1 = validSpots[0];
  const spot2 = validSpots[1];

  // Remove seeds from inventory
  removeItem(spliceSeeds[0], 1);
  removeItem(spliceSeeds[1], 1);

  // Plant on tiles (mark growth)
  const t1 = getTile(spot1.x, spot1.y);
  const t2 = getTile(spot2.x, spot2.y);
  if (t1) { t1.growth = { timer: SPLICE_TIME, result: recipe.result }; }
  if (t2) { t2.growth = { timer: SPLICE_TIME, result: recipe.result }; }

  spawnParticles(spot1.x, spot1.y, '#7fff7f', 8);
  spawnParticles(spot2.x, spot2.y, '#7fff7f', 8);
  spawnFloatingText(spot1.x * TILE + 16, spot1.y * TILE, '🌱 Planting...', '#7fff7f');
  showMessage('🌱 Splicing! Wait 5 seconds...');
  playSound('harvest');
  spliceSeeds = [];
  saveGame();
}

// ---------- TREE GROWTH UPDATE ----------
function updateGrowth(dt) {
  for (let y = 0; y < WORLD_H; y++) {
    for (let x = 0; x < WORLD_W; x++) {
      const t = world[y][x];
      if (t.growth) {
        t.growth.timer -= dt;
        if (t.growth.timer <= 0) {
          // Grow into tree
          const result = t.growth.result;
          // Determine tree type based on result
          let trunkType = TILE_TYPES.TREE_TRUNK;
          let leafType = TILE_TYPES.TREE_LEAVES;
          // If result is "Tree Seed", grow into a regular tree
          // Otherwise grow into a generic tree that yields the result
          t.fg = trunkType;
          t.treeData = { result: result };
          t.growth = null;

          // Add leaves above
          if (y - 1 >= 0 && world[y-1][x].fg === 0) {
            world[y-1][x].fg = leafType;
          }
          if (y - 2 >= 0 && world[y-2][x].fg === 0) {
            world[y-2][x].fg = leafType;
          }
          if (x - 1 >= 0 && y - 1 >= 0 && world[y-1][x-1].fg === 0) {
            world[y-1][x-1].fg = leafType;
          }
          if (x + 1 < WORLD_W && y - 1 >= 0 && world[y-1][x+1].fg === 0) {
            world[y-1][x+1].fg = leafType;
          }

          spawnParticles(x, y, '#4CAF50', 12);
          spawnFloatingText(x * TILE + 16, y * TILE, '🌳 Grown!', '#7fff7f');
          playSound('harvest');
        }
      }
    }
  }
}

// ---------- PHYSICS & MOVEMENT ----------
function updatePlayer() {
  // Horizontal movement
  let moveDir = 0;
  if (keys['a'] || keys['arrowleft']) moveDir = -1;
  if (keys['d'] || keys['arrowright']) moveDir = 1;

  if (moveDir !== 0) {
    player.facing = moveDir;
    player.walkFrame = (player.walkFrame + 0.15) % 4;
  } else {
    player.walkFrame = 0;
  }

  player.vx = moveDir * MOVE_SPEED;

  // Jump (W)
  if ((keys['w'] || keys['arrowup']) && player.onGround) {
    player.vy = JUMP_FORCE;
    player.onGround = false;
  }

  // Gravity
  player.vy += GRAVITY;
  if (player.vy > 15) player.vy = 15;

  // Move X
  player.x += player.vx;
  // Collision X
  resolveCollisions('x');

  // Move Y
  player.y += player.vy;
  player.onGround = false;
  // Collision Y
  resolveCollisions('y');

  // World bounds
  player.x = clamp(player.x, 0, WORLD_W * TILE - player.w);
  if (player.y > WORLD_H * TILE) {
    // fell out - respawn
    player.x = 50 * TILE;
    player.y = 10 * TILE;
    player.vy = 0;
  }

  // Punch cooldown
  if (player.punchTimer > 0) player.punchTimer--;
  if (player.punchAnim > 0) player.punchAnim--;

  // Update camera
  const targetCamX = player.x + player.w/2 - canvas.width / 2;
  const targetCamY = player.y + player.h/2 - canvas.height / 2;
  camera.x += (targetCamX - camera.x) * 0.1;
  camera.y += (targetCamY - camera.y) * 0.1;
  camera.x = clamp(camera.x, 0, WORLD_W * TILE - canvas.width);
  camera.y = clamp(camera.y, 0, WORLD_H * TILE - canvas.height);
}

function resolveCollisions(axis) {
  const left = Math.floor(player.x / TILE);
  const right = Math.floor((player.x + player.w - 1) / TILE);
  const top = Math.floor(player.y / TILE);
  const bottom = Math.floor((player.y + player.h - 1) / TILE);

  for (let ty = top; ty <= bottom; ty++) {
    for (let tx = left; tx <= right; tx++) {
      if (!isSolid(tx, ty)) continue;

      const tileRect = { x: tx * TILE, y: ty * TILE, w: TILE, h: TILE };
      const playerRect = { x: player.x, y: player.y, w: player.w, h: player.h };

      if (!rectsOverlap(tileRect, playerRect)) continue;

      if (axis === 'x') {
        if (player.vx > 0) {
          player.x = tileRect.x - player.w;
        } else if (player.vx < 0) {
          player.x = tileRect.x + TILE;
        }
        player.vx = 0;
      } else {
        if (player.vy > 0) {
          player.y = tileRect.y - player.h;
          player.onGround = true;
        } else if (player.vy < 0) {
          player.y = tileRect.y + TILE;
        }
        player.vy = 0;
      }
    }
  }
}

// ---------- RENDERING ----------
function render() {
  ctx.save();

  // Screen shake
  if (screenShake > 0) {
    const shakeX = rand(-screenShake, screenShake);
    const shakeY = rand(-screenShake, screenShake);
    ctx.translate(shakeX, shakeY);
    screenShake *= 0.85;
    if (screenShake < 0.3) screenShake = 0;
  }

  // Clear
  ctx.fillStyle = '#87CEEB';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Parallax sky / clouds
  drawSky();

  // Draw background layer
  drawBackgroundLayer();

  // Draw foreground tiles
  drawForegroundLayer();

  // Draw particles
  drawParticles();

  // Draw player
  drawPlayer();

  // Draw floating texts
  drawFloatingTexts();

  ctx.restore();
}

function drawSky() {
  // Gradient sky
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#5B9BD5');
  grad.addColorStop(0.6, '#87CEEB');
  grad.addColorStop(1, '#B0E0FF');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Parallax clouds
  const cloudOffset = (camera.x * 0.2) % 400;
  for (let i = -1; i < 4; i++) {
    const cx = i * 400 - cloudOffset + 100;
    const cy = 60 + Math.sin(i * 1.5) * 30;
    drawCloud(cx, cy, 60 + (i % 2) * 30);
  }

  // Sun
  ctx.fillStyle = '#FFE066';
  ctx.beginPath();
  ctx.arc(canvas.width - 100, 80, 40, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#FFF4B0';
  ctx.beginPath();
  ctx.arc(canvas.width - 100, 80, 30, 0, Math.PI * 2);
  ctx.fill();
}

function drawCloud(x, y, size) {
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath();
  ctx.arc(x, y, size * 0.5, 0, Math.PI * 2);
  ctx.arc(x + size * 0.4, y - size * 0.2, size * 0.4, 0, Math.PI * 2);
  ctx.arc(x - size * 0.3, y - size * 0.1, size * 0.35, 0, Math.PI * 2);
  ctx.arc(x + size * 0.1, y + size * 0.1, size * 0.45, 0, Math.PI * 2);
  ctx.fill();
}

function drawBackgroundLayer() {
  const startX = Math.floor(camera.x / TILE) - 1;
  const endX = Math.ceil((camera.x + canvas.width) / TILE) + 1;
  const startY = Math.floor(camera.y / TILE) - 1;
  const endY = Math.ceil((camera.y + canvas.height) / TILE) + 1;

  for (let y = startY; y <= endY; y++) {
    for (let x = startX; x <= endX; x++) {
      if (x < 0 || x >= WORLD_W || y < 0 || y >= WORLD_H) continue;
      const tile = world[y][x];
      if (tile.bg === 0) continue;

      const screenX = x * TILE - camera.x;
      const screenY = y * TILE - camera.y;
      const bgColor = BG_COLORS[tile.bg];
      if (!bgColor) continue;

      // Base color
      ctx.fillStyle = bgColor.base;
      ctx.fillRect(screenX, screenY, TILE, TILE);

      // Texture pattern
      ctx.fillStyle = bgColor.hi;
      if (tile.bg === BG_TYPES.CAVE_BG) {
        // Cave rocks
        ctx.fillRect(screenX + 4, screenY + 4, 8, 8);
        ctx.fillRect(screenX + 18, screenY + 12, 10, 6);
        ctx.fillRect(screenX + 8, screenY + 22, 6, 6);
      } else if (tile.bg === BG_TYPES.WOODEN_BG) {
        // Wood planks
        ctx.fillRect(screenX, screenY + 10, TILE, 2);
        ctx.fillRect(screenX, screenY + 22, TILE, 2);
        ctx.fillRect(screenX + 14, screenY, 2, 10);
        ctx.fillRect(screenX + 24, screenY + 12, 2, 10);
      } else if (tile.bg === BG_TYPES.BLUE_WALLPAPER || tile.bg === BG_TYPES.RED_WALLPAPER) {
        // Wallpaper pattern
        ctx.globalAlpha = 0.15;
        ctx.fillStyle = '#fff';
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.arc(screenX + 8 + (i%2)*16, screenY + 8 + Math.floor(i/2)*16, 4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
    }
  }
}

function drawForegroundLayer() {
  const startX = Math.floor(camera.x / TILE) - 1;
  const endX = Math.ceil((camera.x + canvas.width) / TILE) + 1;
  const startY = Math.floor(camera.y / TILE) - 1;
  const endY = Math.ceil((camera.y + canvas.height) / TILE) + 1;

  for (let y = startY; y <= endY; y++) {
    for (let x = startX; x <= endX; x++) {
      if (x < 0 || x >= WORLD_W || y < 0 || y >= WORLD_H) continue;
      const tile = world[y][x];
      if (tile.fg === 0) continue;

      const screenX = x * TILE - camera.x;
      const screenY = y * TILE - camera.y;

      // Draw growth indicator
      if (tile.growth) {
        ctx.fillStyle = 'rgba(100,255,100,0.3)';
        ctx.fillRect(screenX, screenY, TILE, TILE);
        // Small sprout
        ctx.fillStyle = '#4CAF50';
        ctx.fillRect(screenX + 12, screenY + 18, 8, 10);
        ctx.fillStyle = '#7fff7f';
        ctx.fillRect(screenX + 14, screenY + 14, 4, 6);
        continue; // don't draw normal tile yet
      }

      drawTile(screenX, screenY, tile.fg, x, y);
    }
  }
}

function drawTile(sx, sy, type, tx, ty) {
  const colors = TILE_COLORS[type];
  if (!colors) return;

  // Base
  ctx.fillStyle = colors.base;
  ctx.fillRect(sx, sy, TILE, TILE);

  // Highlight (top edge)
  ctx.fillStyle = colors.hi;
  ctx.fillRect(sx, sy, TILE, 2);
  ctx.fillRect(sx, sy, 2, TILE);

  // Shadow (bottom edge)
  ctx.fillStyle = colors.sh;
  ctx.fillRect(sx, sy + TILE - 2, TILE, 2);
  ctx.fillRect(sx + TILE - 2, sy, 2, TILE);

  // Tile-specific patterns
  if (type === TILE_TYPES.DIRT) {
    ctx.fillStyle = '#7A4A1B';
    ctx.fillRect(sx + 6, sy + 8, 4, 4);
    ctx.fillRect(sx + 20, sy + 18, 5, 5);
    ctx.fillRect(sx + 12, sy + 24, 3, 3);
  } else if (type === TILE_TYPES.ROCK) {
    ctx.fillStyle = '#686868';
    ctx.fillRect(sx + 4, sy + 10, 8, 6);
    ctx.fillRect(sx + 18, sy + 6, 6, 8);
    ctx.fillRect(sx + 10, sy + 20, 10, 5);
  } else if (type === TILE_TYPES.GRASS) {
    ctx.fillStyle = '#35853A';
    ctx.fillRect(sx + 4, sy + 4, 3, 6);
    ctx.fillRect(sx + 14, sy + 2, 2, 8);
    ctx.fillRect(sx + 24, sy + 6, 2, 5);
  } else if (type === TILE_TYPES.SAND) {
    ctx.fillStyle = '#C8B040';
    ctx.fillRect(sx + 4, sy + 8, 2, 2);
    ctx.fillRect(sx + 16, sy + 14, 2, 2);
    ctx.fillRect(sx + 26, sy + 22, 2, 2);
  } else if (type === TILE_TYPES.WOOD) {
    ctx.fillStyle = '#705020';
    ctx.fillRect(sx, sy + 8, TILE, 2);
    ctx.fillRect(sx, sy + 20, TILE, 2);
    ctx.fillRect(sx + 10, sy, 2, 8);
    ctx.fillRect(sx + 20, sy + 10, 2, 10);
  } else if (type === TILE_TYPES.GLASS) {
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = '#7BBBF5';
    ctx.fillRect(sx + 4, sy + 4, 6, 6);
    ctx.fillRect(sx + 18, sy + 12, 8, 8);
    ctx.globalAlpha = 1;
    // Border
    ctx.strokeStyle = '#3B7BB5';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx + 1, sy + 1, TILE - 2, TILE - 2);
  } else if (type === TILE_TYPES.LAVA) {
    // Animated lava
    const offset = Math.sin(gameTime * 0.05 + tx * 0.5 + ty * 0.3) * 4;
    ctx.fillStyle = '#FF7733';
    ctx.fillRect(sx + 4 + offset, sy + 6, 6, 4);
    ctx.fillRect(sx + 18 - offset, sy + 18, 8, 5);
    ctx.fillStyle = '#FFAA55';
    ctx.fillRect(sx + 10, sy + 10, 3, 3);
  } else if (type === TILE_TYPES.WATER) {
    // Animated water
    const offset = Math.sin(gameTime * 0.04 + tx * 0.7) * 3;
    ctx.fillStyle = '#4EA8FF';
    ctx.fillRect(sx + 4 + offset, sy + 8, 10, 2);
    ctx.fillRect(sx + 14 - offset, sy + 20, 12, 2);
  } else if (type === TILE_TYPES.BRICK) {
    ctx.fillStyle = '#802020';
    ctx.fillRect(sx, sy + 10, TILE, 2);
    ctx.fillRect(sx, sy + 22, TILE, 2);
    ctx.fillRect(sx + 15, sy, 2, 10);
    ctx.fillRect(sx + 8, sy + 12, 2, 10);
    ctx.fillRect(sx + 22, sy + 12, 2, 10);
  } else if (type === TILE_TYPES.BEDROCK) {
    // Dark textured bedrock
    ctx.fillStyle = '#2A2A3A';
    ctx.fillRect(sx + 4, sy + 4, 6, 6);
    ctx.fillRect(sx + 18, sy + 8, 8, 4);
    ctx.fillRect(sx + 8, sy + 18, 10, 6);
    ctx.fillRect(sx + 22, sy + 22, 6, 4);
    ctx.fillStyle = '#1A1A2A';
    ctx.fillRect(sx + 14, sy + 14, 4, 4);
  } else if (type === TILE_TYPES.WHITE_DOOR) {
    // White door with frame
    ctx.fillStyle = '#E0E0E0';
    ctx.fillRect(sx + 4, sy + 2, TILE - 8, TILE - 4);
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(sx + 6, sy + 4, TILE - 12, TILE - 8);
    // Door knob
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(sx + TILE - 10, sy + TILE/2, 3, 0, Math.PI * 2);
    ctx.fill();
    // Frame
    ctx.strokeStyle = '#A0A0A0';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx + 3, sy + 1, TILE - 6, TILE - 2);
  } else if (type === TILE_TYPES.TREE_TRUNK) {
    ctx.fillStyle = '#4B2210';
    ctx.fillRect(sx + 10, sy, 12, TILE);
    ctx.fillStyle = '#6B4226';
    ctx.fillRect(sx + 12, sy + 4, 8, 8);
    ctx.fillRect(sx + 12, sy + 18, 8, 8);
    // Rings
    ctx.strokeStyle = '#8B6246';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(sx + 16, sy + 8, 4, 0, Math.PI * 2);
    ctx.stroke();
  } else if (type === TILE_TYPES.TREE_LEAVES) {
    ctx.fillStyle = '#2E7D32';
    ctx.fillRect(sx + 2, sy + 4, 10, 10);
    ctx.fillRect(sx + 16, sy + 2, 12, 12);
    ctx.fillRect(sx + 6, sy + 18, 14, 10);
    ctx.fillStyle = '#4CAF50';
    ctx.fillRect(sx + 6, sy + 8, 6, 6);
    ctx.fillRect(sx + 18, sy + 6, 6, 6);
    ctx.fillRect(sx + 12, sy + 20, 6, 6);
  } else if (type === TILE_TYPES.SANDSTONE) {
    ctx.fillStyle = '#A89040';
    ctx.fillRect(sx + 4, sy + 6, 8, 4);
    ctx.fillRect(sx + 18, sy + 14, 10, 4);
    ctx.fillRect(sx + 8, sy + 22, 6, 4);
  } else if (type === TILE_TYPES.STONE) {
    ctx.fillStyle = '#606060';
    ctx.fillRect(sx + 6, sy + 6, 10, 6);
    ctx.fillRect(sx + 20, sy + 12, 8, 8);
    ctx.fillRect(sx + 8, sy + 20, 8, 6);
  }
}

function drawParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    const sx = p.x - camera.x;
    const sy = p.y - camera.y;
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.fillRect(sx, sy, p.size, p.size);
    ctx.globalAlpha = 1;

    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life--;

    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }
}

function drawPlayer() {
  const sx = player.x - camera.x;
  const sy = player.y - camera.y;

  ctx.save();
  ctx.translate(sx + player.w/2, sy + player.h/2);
  ctx.scale(player.facing, 1);

  // Body (16x24 pixel art)
  // Head
  ctx.fillStyle = '#FFCC99'; // skin
  ctx.fillRect(-6, -14, 12, 10);
  // Hair
  ctx.fillStyle = '#4A2A0A';
  ctx.fillRect(-7, -15, 14, 4);
  ctx.fillRect(-7, -15, 3, 8);
  // Eyes
  ctx.fillStyle = '#222';
  ctx.fillRect(-3, -10, 2, 3);
  ctx.fillRect(3, -10, 2, 3);
  // Mouth
  ctx.fillStyle = '#CC6666';
  ctx.fillRect(-2, -5, 4, 1);
  // Body / shirt
  ctx.fillStyle = '#3366CC';
  ctx.fillRect(-6, -4, 12, 10);
  // Arms
  ctx.fillStyle = '#FFCC99';
  if (player.punchAnim > 0) {
    // Punching arm extended
    ctx.fillRect(6, -2, 10, 4);
    // Fist
    ctx.fillStyle = '#FFAA77';
    ctx.fillRect(14, -3, 4, 5);
  } else {
    ctx.fillRect(-8, -2, 3, 8);
    ctx.fillRect(5, -2, 3, 8);
  }
  // Legs
  ctx.fillStyle = '#2A2A2A';
  if (Math.abs(player.vx) > 0.5) {
    // Walking animation
    const legOffset = Math.sin(player.walkFrame * Math.PI / 2) * 3;
    ctx.fillRect(-4, 6, 4, 8 + legOffset);
    ctx.fillRect(1, 6, 4, 8 - legOffset);
  } else if (!player.onGround) {
    // Jumping
    ctx.fillRect(-4, 6, 4, 7);
    ctx.fillRect(1, 6, 4, 7);
  } else {
    // Idle
    ctx.fillRect(-4, 6, 4, 8);
    ctx.fillRect(1, 6, 4, 8);
  }

  ctx.restore();
}

function drawFloatingTexts() {
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    const sx = ft.x - camera.x;
    const sy = ft.y - camera.y;
    ctx.globalAlpha = ft.life / ft.maxLife;
    ctx.fillStyle = ft.color;
    ctx.font = 'bold 14px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText(ft.text, sx, sy);
    ctx.fillText(ft.text, sx, sy);
    ctx.globalAlpha = 1;
    ft.y += ft.vy;
    ft.life--;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }
  ctx.textAlign = 'left';
}

// ---------- UI UPDATES ----------
function updateHUD() {
  document.getElementById('gemsCount').textContent = gems;
  document.getElementById('lockCount').textContent = worldLockCount;
  const px = Math.floor((player.x + player.w/2) / TILE);
  const py = Math.floor((player.y + player.h/2) / TILE);
  document.getElementById('coordText').textContent = px + ', ' + py;

  const lockHud = document.getElementById('lockHud');
  const nameHud = document.getElementById('playerName');
  if (worldLocked) {
    lockHud.innerHTML = '🔒 <span style="color:#ffd700">WORLD LOCKED</span>';
    nameHud.style.color = '#00ff88';
    nameHud.innerHTML = '👤 Player <span class="locked-icon">🔒</span>';
  } else {
    lockHud.innerHTML = '🔓 <span id="lockCount">' + worldLockCount + '</span> World Lock';
    nameHud.style.color = '#7fff7f';
    nameHud.innerHTML = '👤 Player';
  }
}

function updateHotbarUI() {
  const hotbarEl = document.getElementById('hotbar');
  hotbarEl.innerHTML = '';
  for (let i = 0; i < 8; i++) {
    const slot = document.createElement('div');
    slot.className = 'hotbar-slot' + (i === hotbarIndex ? ' active' : '');
    const itemName = hotbar[i];
    let iconHtml = '';
    let countText = '';
    if (itemName && inventory[itemName] > 0) {
      countText = inventory[itemName];
      iconHtml = getItemIconSVG(itemName);
    } else if (itemName) {
      iconHtml = '<span style="opacity:0.3">' + getItemIconSVG(itemName) + '</span>';
    }
    slot.innerHTML = `
      <span class="key">${i+1}</span>
      <div class="item-icon">${iconHtml}</div>
      <span class="count">${countText}</span>
    `;
    hotbarEl.appendChild(slot);
  }
}

function getItemIconSVG(name) {
  // Return a small inline div with colored background representing the item
  const colors = {
    'Dirt': '#8B5A2B', 'Rock': '#808080', 'Grass': '#4CAF50', 'Sand': '#E8D068',
    'Wood Block': '#A0703B', 'Glass': '#5B9BD5', 'Lava': '#FF4500', 'Water': '#1E90FF',
    'Brick': '#B33A3A', 'Sandstone': '#C8B060', 'Stone': '#707070',
    'Cave Background': '#2A2A3A', 'Wooden Background': '#5A3A1A',
    'Blue Wallpaper': '#2A3A6A', 'Red Wallpaper': '#6A2A2A',
    'Tree Seed': '#2E7D32', 'Tree Leaves': '#4CAF50',
  };
  const c = colors[name] || '#888';
  return `<div style="width:24px;height:24px;background:${c};border:1px solid #000;border-radius:3px;"></div>`;
}

function updateInventoryUI() {
  if (!inventoryOpen) return;
  const grid = document.getElementById('invGrid');
  grid.innerHTML = '';
  const items = Object.keys(inventory).filter(k => inventory[k] > 0);
  for (const item of items) {
    const slot = document.createElement('div');
    slot.className = 'inv-slot';
    slot.innerHTML = `
      ${getItemIconSVG(item)}
      <span class="item-name">${item}</span>
      <span class="item-count">${inventory[item]}</span>
    `;
    slot.onclick = () => {
      // Add to hotbar
      if (hotbar.includes(item)) {
        hotbarIndex = hotbar.indexOf(item);
      } else {
        hotbar[hotbarIndex] = item;
      }
      updateHotbarUI();
      saveGame();
    };
    grid.appendChild(slot);
  }
  if (items.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#888;padding:20px;">Inventory empty</div>';
  }
}

function updateRecipeUI() {
  const list = document.getElementById('recipeList');
  list.innerHTML = '';
  for (const r of RECIPES) {
    const el = document.createElement('div');
    el.className = 'recipe-item';
    el.innerHTML = `
      <span>${r.a}</span>
      <span style="color:#888">+</span>
      <span>${r.b}</span>
      <span style="color:#888">→</span>
      <span class="result">${r.result}</span>
    `;
    list.appendChild(el);
  }
}

// ---------- UI TOGGLES ----------
function toggleInventory() {
  inventoryOpen = !inventoryOpen;
  document.getElementById('inventoryPanel').classList.toggle('open', inventoryOpen);
  if (inventoryOpen) updateInventoryUI();
}
function toggleRecipes() {
  recipesOpen = !recipesOpen;
  document.getElementById('recipePanel').classList.toggle('open', recipesOpen);
  if (recipesOpen) updateRecipeUI();
}
function toggleChat() {
  chatOpen = !chatOpen;
  document.getElementById('chatPanel').classList.toggle('open', chatOpen);
  if (chatOpen) {
    document.getElementById('chatInput').focus();
  }
}

function showMessage(text) {
  const msgs = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'msg';
  el.textContent = text;
  msgs.appendChild(el);
  setTimeout(() => { el.remove(); }, 2500);
  // Also add to chat log
  addChatLog(text);
}

function addChatLog(text) {
  const log = document.getElementById('chatLog');
  const div = document.createElement('div');
  div.textContent = '> ' + text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

// ---------- CHAT COMMANDS ----------
function processChatCommand(input) {
  const trimmed = input.trim();
  if (!trimmed) return;
  addChatLog('You: ' + trimmed);

  if (trimmed.startsWith('/')) {
    const parts = trimmed.slice(1).split(/\s+/);
    const cmd = parts[0].toLowerCase();
    if (cmd === 'help') {
      addChatLog('/give <item> <count> - Give yourself items');
      addChatLog('/help - Show this help');
      addChatLog('/lock - Give yourself a World Lock');
      addChatLog('/gems <count> - Give yourself gems');
    } else if (cmd === 'give') {
      const itemName = parts.slice(1, -1).join(' ') || parts[1];
      const count = parseInt(parts[parts.length - 1]) || 1;
      // Try to match known item
      const knownItems = Object.keys(TILE_NAMES).map(k => TILE_NAMES[k]).concat(
        ['Cave Background', 'Wooden Background', 'Blue Wallpaper', 'Red Wallpaper', 'Tree Seed', 'Tree Leaves']
      );
      let matched = null;
      for (const item of knownItems) {
        if (item.toLowerCase() === itemName.toLowerCase()) {
          matched = item;
          break;
        }
      }
      if (!matched) {
        // Try partial match
        for (const item of knownItems) {
          if (item.toLowerCase().includes(itemName.toLowerCase())) {
            matched = item;
            break;
          }
        }
      }
      if (matched) {
        addItem(matched, count);
        addChatLog('✅ Gave ' + count + ' ' + matched);
      } else {
        addChatLog('❌ Unknown item: ' + itemName);
      }
    } else if (cmd === 'lock') {
      worldLockCount++;
      updateHUD();
      addChatLog('🔒 Gave 1 World Lock');
    } else if (cmd === 'gems') {
      const count = parseInt(parts[1]) || 100;
      gems += count;
      updateHUD();
      addChatLog('💎 Gave ' + count + ' gems');
    } else {
      addChatLog('❌ Unknown command. Type /help');
    }
  } else {
    addChatLog('Player: ' + trimmed);
  }
}

// ---------- WORLD LOCK INSTALLATION ----------
function installWorldLock() {
  if (worldLocked) {
    showMessage('🔒 World already locked!');
    return;
  }
  if (worldLockCount <= 0) {
    showMessage('❌ No World Lock in inventory!');
    playSound('error');
    return;
  }
  // Place on tile below player
  const tx = Math.floor((player.x + player.w/2) / TILE);
  const ty = Math.floor((player.y + player.h/2) / TILE) + 1;
  const tile = getTile(tx, ty);
  if (!tile) { showMessage('❌ Cannot place here'); return; }

  worldLockCount--;
  worldLocked = true;
  worldLockTile = { x: tx, y: ty };
  tile.fg = TILE_TYPES.WHITE_DOOR; // Visual representation
  tile.bg = BG_TYPES.CAVE_BG;
  updateHUD();
  playSound('buy');
  showMessage('🔒 World Locked!');
  spawnParticles(tx, ty, '#ffd700', 20);
  saveGame();
}

// ---------- INPUT HANDLING ----------
function setupInput() {
  window.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    keys[key] = true;

    // Prevent default for game keys
    if (['w','a','s','d',' ','e','b','i','r','t','1','2','3','4','5','6','7','8','arrowup','arrowdown','arrowleft','arrowright'].includes(key) || (key >= '1' && key <= '8')) {
      e.preventDefault();
    }

    // Chat input handling
    if (chatOpen && document.activeElement === document.getElementById('chatInput')) {
      if (key === 'enter') {
        const input = document.getElementById('chatInput');
        processChatCommand(input.value);
        input.value = '';
        document.getElementById('chatInput').focus();
      } else if (key === 'escape') {
        toggleChat();
      }
      return;
    }

    // Global keys
    if (key === 'i') { toggleInventory(); return; }
    if (key === 'r') { toggleRecipes(); return; }
    if (key === 't') { toggleChat(); return; }

    // Hotbar 1-8
    if (key >= '1' && key <= '8') {
      hotbarIndex = parseInt(key) - 1;
      updateHotbarUI();
      return;
    }

    // Punch (SPACE)
    if (key === ' ') {
      doPunch();
      return;
    }

    // Place (E)
    if (key === 'e') {
      placeBlock();
      return;
    }

    // Background mode (B)
    if (key === 'b') {
      bgMode = !bgMode;
      document.getElementById('bgModeIndicator').classList.toggle('active', bgMode);
      showMessage(bgMode ? '🖼️ Background mode ON' : '🖼️ Background mode OFF');
      return;
    }

    // Splicing (R when not in recipe panel - we'll use a different key)
    // Actually we use R for recipes. Splicing is done via inventory selection.
    // Let's add a key for splice: Enter when 2 seeds selected
    if (key === 'enter' && !chatOpen) {
      trySplice();
      return;
    }
  });

  window.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
  });

  // Mouse
  canvas.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    placeBlock();
  });

  canvas.addEventListener('mousedown', (e) => {
    if (e.button === 2) {
      e.preventDefault();
      placeBlock();
    }
  });

  // Chat input enter
  document.getElementById('chatInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      processChatCommand(e.target.value);
      e.target.value = '';
    }
    if (e.key === 'Escape') {
      toggleChat();
    }
    e.stopPropagation();
  });
}

// ---------- GAME LOOP ----------
function gameLoop(timestamp) {
  requestAnimationFrame(gameLoop);

  const dt = Math.min(timestamp - lastTime, 50); // cap dt
  lastTime = timestamp;
  gameTime++;

  // FPS counter
  frameCount++;
  fpsTimer += dt;
  if (fpsTimer >= 1000) {
    fps = Math.round(frameCount * 1000 / fpsTimer);
    document.getElementById('fpsCount').textContent = fps;
    frameCount = 0;
    fpsTimer = 0;
  }

  // Update
  updatePlayer();
  updateGrowth(dt / 16.67); // convert to frame units
  updateHUD();

  // Render
  render();
}

// ---------- INIT ----------
function init() {
  canvas = document.getElementById('gameCanvas');
  ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  // Initialize audio on first interaction
  document.addEventListener('click', initAudio, { once: true });
  document.addEventListener('keydown', initAudio, { once: true });

  // Try load save
  const loaded = loadGame();

  if (!loaded) {
    generateWorld();
    // Starting inventory
    addItem('Dirt', 20);
    addItem('Rock', 10);
    addItem('Sand', 10);
    addItem('Grass', 5);
    addItem('Wood Block', 10);
    addItem('Cave Background', 10);
    addItem('Blue Wallpaper', 5);
    addItem('Tree Seed', 3);
    hotbar[0] = 'Dirt';
    hotbar[1] = 'Rock';
    hotbar[2] = 'Sand';
    hotbar[3] = 'Wood Block';
    hotbar[4] = 'Cave Background';
    hotbar[5] = 'Grass';
    hotbar[6] = 'Blue Wallpaper';
    hotbar[7] = 'Tree Seed';
    gems = 100;
    worldLockCount = 1;
    saveGame();
  }

  // Ensure world is valid
  if (!world || world.length === 0) {
    generateWorld();
  }

  // Update UI
  updateHotbarUI();
  updateInventoryUI();
  updateRecipeUI();
  updateHUD();

  // Setup input
  setupInput();

  // Start loop
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);

  // Initial message
  showMessage('🌱 Welcome to Growtopia-like Sandbox!');
  setTimeout(() => showMessage('📖 Press I for inventory, R for recipes, T for chat'), 2000);
  setTimeout(() => showMessage('⛏️ SPACE to punch, E to place, B for background mode'), 4000);
}

// Start when page loads
window.addEventListener('load', init);
</script>
