<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixelSplice · 2D sandbox</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: #1a2a32;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, monospace;
    }
    .game-wrapper {
      background: #2e4a5c;
      padding: 12px;
      border-radius: 24px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.6);
    }
    canvas {
      display: block;
      border-radius: 16px;
      box-shadow: inset 0 0 0 2px #466b7e, 0 4px 0 #0d1c24;
      cursor: crosshair;
      background: #6f9ab0;
    }
    .ui-panel {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      color: #f0f9ff;
      text-shadow: 2px 2px 0 #0d1c24;
      font-weight: bold;
      font-size: 15px;
    }
    .hotbar {
      display: flex;
      gap: 6px;
      background: #1e3b48;
      padding: 6px 10px;
      border-radius: 40px;
      box-shadow: inset 0 0 0 2px #2f5a6b, 0 4px 0 #0a1a22;
    }
    .slot {
      width: 52px;
      height: 52px;
      background: #234a5a;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      box-shadow: inset 0 -3px 0 #0e2a33, 0 2px 0 #0d1c24;
      transition: 0.05s linear;
      color: white;
      font-weight: bold;
    }
    .slot.active {
      background: #5d8fa5;
      box-shadow: inset 0 0 0 3px #f5e56b, 0 2px 0 #0d1c24;
      transform: scale(1.02);
    }
    .slot .count {
      font-size: 12px;
      background: #00000055;
      padding: 0 6px;
      border-radius: 20px;
      margin-top: 2px;
    }
    .gems {
      background: #1e3b48;
      padding: 8px 18px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: inset 0 0 0 2px #2f5a6b, 0 4px 0 #0a1a22;
    }
    .btn {
      background: #3d6d82;
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 40px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 4px 0 #0e2a33;
      transition: 0.08s linear;
      text-shadow: 1px 1px 0 #0d1c24;
      font-family: inherit;
    }
    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0e2a33;
    }
    .recipe-toggle {
      background: #6b4f2e;
      box-shadow: 0 4px 0 #3d2e1b;
    }
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #0d1c24ee;
      color: #f5e56b;
      padding: 10px 28px;
      border-radius: 40px;
      font-weight: bold;
      font-size: 18px;
      letter-spacing: 1px;
      backdrop-filter: blur(4px);
      box-shadow: 0 8px 0 #00000055;
      transition: opacity 0.3s;
      pointer-events: none;
      opacity: 0;
      z-index: 999;
      border: 2px solid #f5e56b88;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
    }
    .recipe-panel {
      background: #1e3b48ee;
      backdrop-filter: blur(6px);
      border-radius: 24px;
      padding: 18px 24px;
      max-width: 400px;
      color: #d9eef9;
      font-size: 14px;
      line-height: 1.6;
      box-shadow: 0 8px 0 #0a1a22;
      border: 2px solid #2f5a6b;
      max-height: 240px;
      overflow-y: auto;
      pointer-events: auto;
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      display: none;
    }
    .recipe-panel.visible {
      display: block;
    }
    .recipe-panel h3 {
      margin: 0 0 8px;
      color: #f5e56b;
      font-size: 18px;
      text-align: center;
    }
    .recipe-item {
      padding: 4px 0;
      border-bottom: 1px dashed #3d6d82;
    }
  </style>
</head>
<body>
<div class="game-wrapper">
  <canvas id="gameCanvas" width="800" height="576"></canvas>
  <div class="ui-panel">
    <div class="hotbar" id="hotbar"></div>
    <div class="gems">
      <span>💎</span>
      <span id="gemDisplay">0</span>
    </div>
    <button class="btn" id="buySeedPack">🌱 Seed Pack (10💎)</button>
    <button class="btn recipe-toggle" id="toggleRecipes">📖 Recipes</button>
  </div>
</div>
<div id="toast" class="toast"></div>
<div id="recipePanel" class="recipe-panel">
  <h3>🔬 Splicing Recipes</h3>
  <div id="recipeList"></div>
  <div style="margin-top:12px; font-size:12px; opacity:0.8; text-align:center;">Plant two seeds side by side, wait for the splice!</div>
</div>

<script>
  (function() {
    // ---------- CONSTANTS ----------
    const TILE_SIZE = 32;
    const COLS = 25;
    const ROWS = 18;
    const CANVAS_W = COLS * TILE_SIZE;
    const CANVAS_H = ROWS * TILE_SIZE;

    // ---------- TILE TYPES ----------
    const TILE_TYPES = {
      EMPTY: 0,
      DIRT: 1,
      ROCK: 2,
      WATER: 3,
      GRASS: 4,
      SAND: 5,
      FLOWER: 6,
      GLASS: 7,
      STONE: 8,
      WOOD: 9,
      LEAF: 10,
      GOLD: 11,
    };

    // ---------- ITEM DEFINITIONS (seed / block) ----------
    const ITEMS = {
      dirt_seed:   { name: 'Dirt Seed',   emoji: '🟫', color: '#8b5a2b', type: 'seed',  tile: TILE_TYPES.DIRT,  sell: 1 },
      rock_seed:   { name: 'Rock Seed',   emoji: '🪨', color: '#7a7a7a', type: 'seed',  tile: TILE_TYPES.ROCK,  sell: 1 },
      water_seed:  { name: 'Water Seed',  emoji: '💧', color: '#3a8fc2', type: 'seed',  tile: TILE_TYPES.WATER, sell: 1 },
      grass_seed:  { name: 'Grass Seed',  emoji: '🌿', color: '#4caf50', type: 'seed',  tile: TILE_TYPES.GRASS, sell: 2 },
      sand_seed:   { name: 'Sand Seed',   emoji: '🏖️', color: '#e3c27b', type: 'seed',  tile: TILE_TYPES.SAND,  sell: 2 },
      flower_seed: { name: 'Flower Seed', emoji: '🌸', color: '#e97a9e', type: 'seed',  tile: TILE_TYPES.FLOWER, sell: 3 },
      wood_seed:   { name: 'Wood Seed',   emoji: '🪵', color: '#a0662b', type: 'seed',  tile: TILE_TYPES.WOOD,  sell: 3 },
      gold_seed:   { name: 'Gold Seed',   emoji: '✨', color: '#f5c542', type: 'seed',  tile: TILE_TYPES.GOLD,  sell: 8 },

      dirt_block:   { name: 'Dirt Block',   emoji: '🟫', color: '#8b5a2b', type: 'block', tile: TILE_TYPES.DIRT,  sell: 1 },
      rock_block:   { name: 'Rock Block',   emoji: '🪨', color: '#7a7a7a', type: 'block', tile: TILE_TYPES.ROCK,  sell: 1 },
      water_block:  { name: 'Water Block',  emoji: '💧', color: '#3a8fc2', type: 'block', tile: TILE_TYPES.WATER, sell: 1 },
      grass_block:  { name: 'Grass Block',  emoji: '🌿', color: '#4caf50', type: 'block', tile: TILE_TYPES.GRASS, sell: 2 },
      sand_block:   { name: 'Sand Block',   emoji: '🏖️', color: '#e3c27b', type: 'block', tile: TILE_TYPES.SAND,  sell: 2 },
      flower_block: { name: 'Flower Block', emoji: '🌸', color: '#e97a9e', type: 'block', tile: TILE_TYPES.FLOWER, sell: 3 },
      glass_block:  { name: 'Glass Block',  emoji: '🔷', color: '#a8d8ea', type: 'block', tile: TILE_TYPES.GLASS, sell: 4 },
      stone_block:  { name: 'Stone Block',  emoji: '⬛', color: '#5a5a5a', type: 'block', tile: TILE_TYPES.STONE, sell: 3 },
      wood_block:   { name: 'Wood Block',   emoji: '🪵', color: '#a0662b', type: 'block', tile: TILE_TYPES.WOOD,  sell: 3 },
      leaf_block:   { name: 'Leaf Block',   emoji: '🍃', color: '#3e9e4b', type: 'block', tile: TILE_TYPES.LEAF,  sell: 2 },
      gold_block:   { name: 'Gold Block',   emoji: '✨', color: '#f5c542', type: 'block', tile: TILE_TYPES.GOLD,  sell: 10 },
    };

    // ---------- SPLICING RECIPES (unordered pairs) ----------
    const SPLICE_RECIPES = [
      { a: 'dirt_seed', b: 'rock_seed', result: 'sand_seed', count: 1 },
      { a: 'sand_seed', b: 'water_seed', result: 'glass_block', count: 1 },
      { a: 'dirt_seed', b: 'water_seed', result: 'grass_seed', count: 1 },
      { a: 'rock_seed', b: 'rock_seed', result: 'stone_block', count: 1 },
      { a: 'grass_seed', b: 'sand_seed', result: 'flower_seed', count: 1 },
      { a: 'wood_seed', b: 'leaf_seed', result: 'wood_block', count: 1 },      // leaf_seed not in items? we'll add a dummy leaf_seed? We'll use wood_seed + grass_seed = wood_block
      { a: 'grass_seed', b: 'wood_seed', result: 'wood_block', count: 1 },
      { a: 'stone_block', b: 'gold_seed', result: 'gold_block', count: 1 },
      { a: 'flower_seed', b: 'water_seed', result: 'flower_block', count: 1 },
    ];

    // ---------- GAME STATE ----------
    let world = [];          // 2D array of tile types
    let inventory = {};      // itemId -> count
    let gems = 0;
    let hotbar = [
      'dirt_seed', 'rock_seed', 'water_seed', 'grass_seed',
      'sand_seed', 'flower_seed', 'stone_block', 'gold_seed'
    ];
    let selectedSlot = 0;    // 0-7

    // Player position (grid coords, can be fractional)
    let player = { x: 10.5, y: 9.5 };

    // Splice timers: { tileIndex: { x, y, otherX, otherY, result, timeLeft, seedA, seedB } }
    // We'll store active splice as array of objects for simplicity
    let activeSplices = [];   // each: { x1,y1, x2,y2, resultItem, timeLeft, timerId }

    // Toast timeout
    let toastTimer = null;

    // ---------- CANVAS SETUP ----------
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = CANVAS_W;
    canvas.height = CANVAS_H;

    // ---------- HELPER FUNCTIONS ----------
    function getItem(id) {
      return ITEMS[id] || null;
    }

    function addItem(itemId, amount = 1) {
      if (!ITEMS[itemId]) return;
      inventory[itemId] = (inventory[itemId] || 0) + amount;
      autoSave();
    }

    function removeItem(itemId, amount = 1) {
      if (!inventory[itemId] || inventory[itemId] < amount) return false;
      inventory[itemId] -= amount;
      if (inventory[itemId] <= 0) delete inventory[itemId];
      autoSave();
      return true;
    }

    function getItemCount(itemId) {
      return inventory[itemId] || 0;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    // ---------- WORLD GENERATION ----------
    function generateWorld() {
      world = [];
      for (let r = 0; r < ROWS; r++) {
        let row = [];
        for (let c = 0; c < COLS; c++) {
          // simple terrain: mostly dirt, some rock, water at bottom?
          if (r > ROWS - 4 && Math.random() < 0.2) row.push(TILE_TYPES.WATER);
          else if (Math.random() < 0.15) row.push(TILE_TYPES.ROCK);
          else if (Math.random() < 0.08) row.push(TILE_TYPES.GOLD);
          else row.push(TILE_TYPES.DIRT);
        }
        world.push(row);
      }
      // clear an area around spawn
      for (let r = 7; r < 12; r++) {
        for (let c = 8; c < 13; c++) {
          world[r][c] = TILE_TYPES.EMPTY;
        }
      }
    }

    // ---------- SAVE / LOAD ----------
    function saveGame() {
      const data = {
        world,
        inventory,
        gems,
        hotbar,
        selectedSlot,
        player: { x: player.x, y: player.y },
        // we don't save active splices – they reset on reload
      };
      try {
        localStorage.setItem('pixelsplice_save', JSON.stringify(data));
      } catch (e) { /* ignore */ }
    }

    function loadGame() {
      const raw = localStorage.getItem('pixelsplice_save');
      if (!raw) return false;
      try {
        const data = JSON.parse(raw);
        if (data.world && data.world.length === ROWS && data.world[0].length === COLS) {
          world = data.world;
        } else {
          generateWorld();
        }
        inventory = data.inventory || {};
        gems = data.gems || 0;
        hotbar = data.hotbar || ['dirt_seed', 'rock_seed', 'water_seed', 'grass_seed', 'sand_seed', 'flower_seed', 'stone_block', 'gold_seed'];
        selectedSlot = data.selectedSlot || 0;
        if (data.player) player = { x: data.player.x, y: data.player.y };
        else player = { x: 10.5, y: 9.5 };
        return true;
      } catch (e) {
        generateWorld();
        return false;
      }
    }

    function autoSave() {
      saveGame();
    }

    // ---------- INITIALIZE INVENTORY IF EMPTY (first play) ----------
    function initStartingInventory() {
      if (Object.keys(inventory).length === 0) {
        inventory = {
          dirt_seed: 5,
          rock_seed: 3,
          water_seed: 3,
          grass_seed: 2,
          sand_seed: 1,
          flower_seed: 1,
          wood_seed: 1,
          stone_block: 1,
          gold_seed: 0,
        };
        gems = 15;
        autoSave();
      }
    }

    // ---------- UI RENDERING ----------
    function renderHotbar() {
      const hotbarDiv = document.getElementById('hotbar');
      hotbarDiv.innerHTML = '';
      for (let i = 0; i < 8; i++) {
        const itemId = hotbar[i];
        const item = getItem(itemId);
        const slot = document.createElement('div');
        slot.className = 'slot' + (i === selectedSlot ? ' active' : '');
        slot.dataset.index = i;
        if (item) {
          slot.innerHTML = `${item.emoji}<span class="count">${getItemCount(itemId)}</span>`;
          slot.title = item.name;
        } else {
          slot.innerHTML = '·';
        }
        slot.addEventListener('click', () => {
          selectedSlot = i;
          renderHotbar();
        });
        hotbarDiv.appendChild(slot);
      }
      document.getElementById('gemDisplay').textContent = gems;
    }

    function updateGemDisplay() {
      document.getElementById('gemDisplay').textContent = gems;
    }

    // ---------- WORLD RENDERING ----------
    function drawWorld() {
      // background grid
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const x = c * TILE_SIZE;
          const y = r * TILE_SIZE;
          const tile = world[r][c];
          // base grass background
          ctx.fillStyle = '#7fb08c';
          ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
          // tile color
          let color = '#6b8f7a';
          let emoji = null;
          switch (tile) {
            case TILE_TYPES.DIRT: color = '#8b5a2b'; emoji = '🟫'; break;
            case TILE_TYPES.ROCK: color = '#6e6e6e'; emoji = '🪨'; break;
            case TILE_TYPES.WATER: color = '#3a8fc2'; emoji = '💧'; break;
            case TILE_TYPES.GRASS: color = '#4caf50'; emoji = '🌿'; break;
            case TILE_TYPES.SAND: color = '#e3c27b'; emoji = '🏖️'; break;
            case TILE_TYPES.FLOWER: color = '#e97a9e'; emoji = '🌸'; break;
            case TILE_TYPES.GLASS: color = '#a8d8ea'; emoji = '🔷'; break;
            case TILE_TYPES.STONE: color = '#5a5a5a'; emoji = '⬛'; break;
            case TILE_TYPES.WOOD: color = '#a0662b'; emoji = '🪵'; break;
            case TILE_TYPES.LEAF: color = '#3e9e4b'; emoji = '🍃'; break;
            case TILE_TYPES.GOLD: color = '#f5c542'; emoji = '✨'; break;
            case TILE_TYPES.EMPTY: color = '#6f9ab0'; emoji = null; break;
            default: color = '#6f9ab0';
          }
          if (tile !== TILE_TYPES.EMPTY) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
            if (emoji) {
              ctx.font = '20px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillStyle = '#00000066';
              ctx.fillText(emoji, x + TILE_SIZE/2 + 1, y + TILE_SIZE/2 + 2);
              ctx.fillStyle = '#ffffff';
              ctx.fillText(emoji, x + TILE_SIZE/2, y + TILE_SIZE/2);
            }
          } else {
            // empty grid line
            ctx.strokeStyle = '#4d7a8f';
            ctx.lineWidth = 0.5;
            ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);
          }
        }
      }

      // draw active splices (glowing)
      for (let s of activeSplices) {
        // draw two markers at positions
        [ [s.x1, s.y1], [s.x2, s.y2] ].forEach(([sx, sy]) => {
          ctx.fillStyle = '#f5e56bcc';
          ctx.beginPath();
          ctx.arc(sx * TILE_SIZE + TILE_SIZE/2, sy * TILE_SIZE + TILE_SIZE/2, 10, 0, 2*Math.PI);
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.stroke();
        });
        // draw result icon floating between
        const midX = (s.x1 + s.x2) / 2 * TILE_SIZE + TILE_SIZE/2;
        const midY = (s.y1 + s.y2) / 2 * TILE_SIZE + TILE_SIZE/2;
        ctx.font = '28px "Segoe UI Emoji", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffffffee';
        ctx.fillText('✨', midX, midY - 12);
      }

      // draw player (simple emoji)
      const px = player.x * TILE_SIZE;
      const py = player.y * TILE_SIZE;
      ctx.font = '32px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#00000066';
      ctx.fillText('🧑', px + 2, py + 4);
      ctx.fillStyle = '#ffffff';
      ctx.fillText('🧑', px, py);
    }

    // ---------- PLAYER MOVEMENT ----------
    const keys = {};
    window.addEventListener('keydown', (e) => {
      const key = e.key;
      if (key.startsWith('Arrow') || key === ' ' || key === 'w' || key === 'a' || key === 's' || key === 'd') {
        e.preventDefault();
      }
      keys[key] = true;
      // number keys 1-8 select hotbar
      if (key >= '1' && key <= '8') {
        selectedSlot = parseInt(key) - 1;
        renderHotbar();
      }
    });
    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    function updatePlayerMovement(delta) {
      const speed = 0.15;
      let dx = 0, dy = 0;
      if (keys['w'] || keys['ArrowUp']) dy -= speed;
      if (keys['s'] || keys['ArrowDown']) dy += speed;
      if (keys['a'] || keys['ArrowLeft']) dx -= speed;
      if (keys['d'] || keys['ArrowRight']) dx += speed;
      if (dx !== 0 || dy !== 0) {
        // clamp within world
        let nx = player.x + dx;
        let ny = player.y + dy;
        nx = Math.max(0.5, Math.min(COLS - 0.5, nx));
        ny = Math.max(0.5, Math.min(ROWS - 0.5, ny));
        player.x = nx;
        player.y = ny;
      }
    }

    // ---------- SPLICING LOGIC ----------
    function trySplice(x1, y1, x2, y2) {
      // Check if tiles are adjacent (orthogonal)
      const dx = Math.abs(x1 - x2);
      const dy = Math.abs(y1 - y2);
      if ((dx === 1 && dy === 0) || (dx === 0 && dy === 1)) {
        // Get tile contents from world
        const tile1 = world[y1][x1];
        const tile2 = world[y2][x2];
        // map tile types to seed items (reverse lookup)
        const tileToSeed = {
          [TILE_TYPES.DIRT]: 'dirt_seed',
          [TILE_TYPES.ROCK]: 'rock_seed',
          [TILE_TYPES.WATER]: 'water_seed',
          [TILE_TYPES.GRASS]: 'grass_seed',
          [TILE_TYPES.SAND]: 'sand_seed',
          [TILE_TYPES.FLOWER]: 'flower_seed',
          [TILE_TYPES.WOOD]: 'wood_seed',
          [TILE_TYPES.GOLD]: 'gold_seed',
        };
        const seed1 = tileToSeed[tile1];
        const seed2 = tileToSeed[tile2];
        if (!seed1 || !seed2) return false;

        // find matching recipe
        for (let rec of SPLICE_RECIPES) {
          if ((rec.a === seed1 && rec.b === seed2) || (rec.a === seed2 && rec.b === seed1)) {
            // Remove the two tiles (set to empty)
            world[y1][x1] = TILE_TYPES.EMPTY;
            world[y2][x2] = TILE_TYPES.EMPTY;
            // Create active splice
            const splice = {
              x1, y1, x2, y2,
              resultItem: rec.result,
              resultCount: rec.count || 1,
              timeLeft: 4.0, // seconds
            };
            activeSplices.push(splice);
            autoSave();
            showToast(`✨ Splice started! Wait ${splice.timeLeft.toFixed(0)}s`);
            return true;
          }
        }
        // no valid recipe
        showToast('❌ Kombinasi gagal');
        // return one seed? we didn't consume, just failed
        return false;
      }
      return false;
    }

    function updateSplices(delta) {
      for (let i = activeSplices.length - 1; i >= 0; i--) {
        const s = activeSplices[i];
        s.timeLeft -= delta;
        if (s.timeLeft <= 0) {
          // Harvest: give result item to inventory
          addItem(s.resultItem, s.resultCount);
          showToast(`🌱 Splice complete! +${s.resultCount} ${getItem(s.resultItem)?.name || 'item'}`);
          activeSplices.splice(i, 1);
          autoSave();
        }
      }
    }

    // ---------- MOUSE INTERACTION ----------
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const mouseX = (e.clientX - rect.left) * scaleX;
      const mouseY = (e.clientY - rect.top) * scaleY;
      const tileX = Math.floor(mouseX / TILE_SIZE);
      const tileY = Math.floor(mouseY / TILE_SIZE);
      if (tileX < 0 || tileX >= COLS || tileY < 0 || tileY >= ROWS) return;

      // check distance from player (max 3 tiles)
      const dist = Math.hypot(player.x - (tileX + 0.5), player.y - (tileY + 0.5));
      if (dist > 3.5) {
        showToast('📏 Terlalu jauh');
        return;
      }

      const currentTile = world[tileY][tileX];

      if (e.button === 0) { // LEFT CLICK = BREAK
        if (currentTile === TILE_TYPES.EMPTY) return;
        // break tile -> get block item + gems
        const tileToBlock = {
          [TILE_TYPES.DIRT]: 'dirt_block',
          [TILE_TYPES.ROCK]: 'rock_block',
          [TILE_TYPES.WATER]: 'water_block',
          [TILE_TYPES.GRASS]: 'grass_block',
          [TILE_TYPES.SAND]: 'sand_block',
          [TILE_TYPES.FLOWER]: 'flower_block',
          [TILE_TYPES.GLASS]: 'glass_block',
          [TILE_TYPES.STONE]: 'stone_block',
          [TILE_TYPES.WOOD]: 'wood_block',
          [TILE_TYPES.LEAF]: 'leaf_block',
          [TILE_TYPES.GOLD]: 'gold_block',
        };
        const blockId = tileToBlock[currentTile];
        if (blockId) {
          addItem(blockId, 1);
          // give gems (1-3)
          const gemReward = Math.floor(Math.random() * 3) + 1;
          gems += gemReward;
          updateGemDisplay();
          world[tileY][tileX] = TILE_TYPES.EMPTY;
          showToast(`⛏️ +1 ${getItem(blockId)?.name || 'Block'} & +${gemReward}💎`);
          autoSave();
        }
      } else if (e.button === 2) { // RIGHT CLICK = PLACE or SPLICE
        const selectedItemId = hotbar[selectedSlot];
        const item = getItem(selectedItemId);
        if (!item) return;

        // If tile is empty and we have seed/block, place it
        if (currentTile === TILE_TYPES.EMPTY) {
          if (item.type === 'seed' || item.type === 'block') {
            if (getItemCount(selectedItemId) > 0) {
              // Place tile (use item.tile)
              world[tileY][tileX] = item.tile;
              removeItem(selectedItemId, 1);
              showToast(`✅ Placed ${item.name}`);
              autoSave();
              // After placing, check for splice opportunities with adjacent tiles
              // check all 4 neighbors
              const neighbors = [
                [tileX+1, tileY], [tileX-1, tileY], [tileX, tileY+1], [tileX, tileY-1]
              ];
              for (let [nx, ny] of neighbors) {
                if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                  const neighborTile = world[ny][nx];
                  if (neighborTile !== TILE_TYPES.EMPTY) {
                    trySplice(tileX, tileY, nx, ny);
                  }
                }
              }
            } else {
              showToast(`❌ ${item.name} habis`);
            }
          }
        } else {
          // Tile not empty -> attempt splice if both are seeds (tiles represent seeds)
          trySplice(tileX, tileY, tileX, tileY); // not adjacent; but we need second tile
          // Actually splice is triggered by placing second seed. So nothing here.
        }
      }
      renderHotbar();
    });

    // ---------- SHOP / SEED PACK ----------
    document.getElementById('buySeedPack').addEventListener('click', () => {
      if (gems < 10) {
        showToast('💎 Permata tidak cukup!');
        return;
      }
      gems -= 10;
      // random seed from a pool
      const seedPool = ['dirt_seed', 'rock_seed', 'water_seed', 'grass_seed', 'sand_seed', 'flower_seed', 'wood_seed'];
      const randomSeed = seedPool[Math.floor(Math.random() * seedPool.length)];
      addItem(randomSeed, 1);
      updateGemDisplay();
      renderHotbar();
      showToast(`🎁 Dapat ${getItem(randomSeed)?.name || 'seed'}!`);
      autoSave();
    });

    // ---------- RECIPE PANEL TOGGLE ----------
    const recipePanel = document.getElementById('recipePanel');
    document.getElementById('toggleRecipes').addEventListener('click', () => {
      recipePanel.classList.toggle('visible');
    });

    // populate recipe list
    function renderRecipeList() {
      const listDiv = document.getElementById('recipeList');
      listDiv.innerHTML = '';
      SPLICE_RECIPES.forEach(rec => {
        const itemA = getItem(rec.a);
        const itemB = getItem(rec.b);
        const resultItem = getItem(rec.result);
        if (itemA && itemB && resultItem) {
          const el = document.createElement('div');
          el.className = 'recipe-item';
          el.textContent = `${itemA.emoji} ${itemA.name} + ${itemB.emoji} ${itemB.name} → ${resultItem.emoji} ${resultItem.name} (x${rec.count || 1})`;
          listDiv.appendChild(el);
        }
      });
    }

    // ---------- GAME LOOP ----------
    let lastTime = performance.now();
    function gameLoop(now) {
      const delta = Math.min((now - lastTime) / 1000, 0.1); // cap delta
      lastTime = now;

      updatePlayerMovement(delta);
      updateSplices(delta);
      drawWorld();

      // auto-save occasionally (every ~10 sec handled by events, but also periodic)
      requestAnimationFrame(gameLoop);
    }

    // ---------- INIT ----------
    function init() {
      const loaded = loadGame();
      if (!loaded) {
        generateWorld();
        initStartingInventory();
      }
      // ensure inventory has something
      if (Object.keys(inventory).length === 0) initStartingInventory();
      if (gems === 0 && !loaded) gems = 15;
      updateGemDisplay();
      renderHotbar();
      renderRecipeList();
      autoSave();
      requestAnimationFrame(gameLoop);
    }

    // Add extra recipe adjustment: ensure leaf_seed not needed. We already have wood_block from grass+wood.
    // Fix recipe list to remove leaf_seed reference
    SPLICE_RECIPES[5] = { a: 'grass_seed', b: 'wood_seed', result: 'wood_block', count: 1 };
    SPLICE_RECIPES.splice(6, 1); // remove duplicate maybe

    init();

  })();
</script>
</body>
